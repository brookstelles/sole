<title>SolePro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column. Sticky header with the date, one screen per tab, a fixed tab bar with four big targets, bottom sheets for details and booking.
   Look taken from her business cards: sea-glass blue ground, aqua for the next client, gold foil for anything that needs her, thin geometric type, a line-drawn flower. */
:root{
  --bg:#E3ECED; --surface:#F8FBFB; --sunk:#D2E0E2; --ink:#1C3335; --muted:#52696C; --line:#C2D4D7; --art:#8FB1B9;
  --accent:#2B686C; --accent-ink:#FFFFFF; --accent-soft:#CDE3E1;
  --hero-a:#A9CFC6; --hero-b:#8CBBB1; --hero-ink:#163033; --hero-btn:rgba(255,255,255,.42);
  --warm:#856519; --warm-soft:#F0E7CF; --gold:#BE9A45; --bad:#9E3426; --bad-soft:#F5DCD7;
  --scrim:rgba(14,30,32,.48);
  --shadow:0 1px 2px rgba(20,45,48,.06),0 6px 18px rgba(20,45,48,.07);
  --display:"Josefin Sans","Avenir Next","Century Gothic",Futura,sans-serif;
  --body:"Jost","Avenir Next",Futura,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E191B; --surface:#162325; --sunk:#1E2F31; --ink:#E2EDED; --muted:#98AEB0; --line:#293C3F; --art:#3E5A5F;
  --accent:#8CC8BF; --accent-ink:#0C1B1C; --accent-soft:#1C3A3A;
  --hero-a:#24453F; --hero-b:#1B3632; --hero-ink:#E6F2EF; --hero-btn:rgba(255,255,255,.09);
  --warm:#DCBB68; --warm-soft:#332B16; --gold:#C9A653; --bad:#F0907F; --bad-soft:#3D221D;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E191B; --surface:#162325; --sunk:#1E2F31; --ink:#E2EDED; --muted:#98AEB0; --line:#293C3F; --art:#3E5A5F;
  --accent:#8CC8BF; --accent-ink:#0C1B1C; --accent-soft:#1C3A3A;
  --hero-a:#24453F; --hero-b:#1B3632; --hero-ink:#E6F2EF; --hero-btn:rgba(255,255,255,.09);
  --warm:#DCBB68; --warm-soft:#332B16; --gold:#C9A653; --bad:#F0907F; --bad-soft:#3D221D;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.hdr{overflow:hidden;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 12px}
.hdr > div{flex:1;min-width:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.hdr-top .eyebrow{margin:0}
.hdr h1{font-size:32px;line-height:1.1;font-weight:300}
.hdr h1::after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin-top:10px;border-radius:2px}
.lily{position:absolute;pointer-events:none;color:var(--art)}
.hdr .lily{width:170px;right:-46px;top:-34px;opacity:.7;z-index:-1}
.hdr{isolation:isolate}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}

main{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:22px}
.sec-h .aside{font-size:14px;color:var(--muted)}
.lede{font-size:19px;color:var(--ink)}
.lede b{font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}

.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.next{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.next .lily{width:190px;right:-60px;bottom:-70px;color:var(--hero-ink);opacity:.14;z-index:-1}
.next .eyebrow{color:inherit;opacity:.8;margin:0}
.next h2{font-size:28px;font-weight:400}
.next .facts{display:flex;flex-direction:column;gap:6px;font-size:16px}
.next .facts span{display:flex;gap:8px;align-items:flex-start}
.next .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next .btn{background:var(--hero-btn);color:inherit}

.btn{min-height:50px;border:0;border-radius:14px;padding:10px 14px;font-weight:600;font-size:16px;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.warm{background:var(--warm);color:var(--surface)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.line{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* needs-you cards */
.pp-miss .td-i{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.pp-miss b{color:var(--muted);font-weight:600}
.warn-t{color:var(--warm);font-weight:600}
.bad-t{color:var(--bad);font-weight:600}
.li.td{grid-template-columns:34px 1fr auto;width:100%;text-align:left;font:inherit;color:inherit}
.td-i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);flex:none}
.td-i svg{width:18px;height:18px}
.li.td[aria-expanded="true"] > svg:last-child{transform:rotate(90deg)}
.td-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--accent);font-weight:600;font-size:15px;padding:12px;min-height:48px}
.td-more svg{width:16px;height:16px}
.tile-more{grid-column:1 / -1;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;line-height:1.35;text-align:center}
.mbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.mbar button{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0;color:var(--muted)}
.mbar-t{position:relative;height:76px}
.mbar-t u,.mbar-t i{position:absolute;bottom:0;border-radius:4px 4px 0 0}
.mbar-t u{left:0;right:0;background:var(--sunk);text-decoration:none}
.mbar-t i{left:22%;right:22%;background:var(--accent);opacity:.55}
.mbar .now .mbar-t i{opacity:1}
.mbar .ahead .mbar-t i{opacity:.25}
.mbar-l{font-size:11.5px;text-align:center;font-weight:600}
.mbar .now .mbar-l{color:var(--ink)}
.month-cmp .chips{margin-bottom:4px}
.hn{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--bad-soft);color:var(--bad);font-size:11px;font-weight:800;font-style:normal;vertical-align:1px;margin-left:2px}
.td-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px}
.td-body .list.flat{box-shadow:none;background:transparent}
.need{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--warm-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:18px;padding:14px 14px 14px 16px}
.need p:first-child{font-weight:600}
.need .btn{min-height:44px;font-size:15px;background:var(--surface);color:var(--ink)}
.need.req{grid-template-columns:1fr}
.need.req .btn-row .btn.primary{background:var(--accent);color:var(--accent-ink)}

/* ask */
.ask{display:flex;gap:8px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:6px 6px 6px 14px;align-items:center}
.ask input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:17px;outline:none}
.ask button{width:44px;height:44px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.ask svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px;font-size:15px;font-weight:500;color:var(--ink);min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.dim{opacity:.5}
.chip.sm{min-height:30px;padding:3px 11px;font-size:13px;letter-spacing:0;text-transform:none}
.lbl-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat3.two{grid-template-columns:repeat(2,1fr)}
.two-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two-in > *{min-width:0}
.text-in[type="date"]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
.list.flat{box-shadow:none;background:transparent}
.list.flat .li{padding-inline:0}
.num.out{color:var(--muted)}
.rcp-snap{cursor:pointer}
.rcp-img{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:14px;background:var(--sunk);margin-block:10px}
/* Sign-in on SolePro's website: a sunrise over the water, played once as the page opens; the card floats on the sea */
.signin{--hz:clamp(250px,50vh,460px);position:fixed;inset:0;z-index:30;overflow-x:hidden;overflow-y:auto;background:#14112E;color:#fff;text-align:center}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sky .air{position:absolute;inset:0 0 auto;height:var(--hz);overflow:hidden;
  background:linear-gradient(180deg,#120F2C 0%,#1F1A4D 34%,#3F3680 60%,#9C6E7E 80%,#E9A75C 94%,#F6C46C 100%)}
.sky .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:sky-twinkle 4s ease-in-out infinite alternate}
.sky .glow{position:absolute;left:50%;bottom:-170px;width:560px;height:340px;margin-left:-280px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(250,216,137,.6),rgba(250,216,137,0));animation:sky-glow 2.4s .2s ease-out both}
.sky .sun{position:absolute;left:50%;bottom:-52px;width:150px;height:150px;margin-left:-75px;animation:sky-rise 2s .15s cubic-bezier(.2,.7,.2,1) both}
.sky .sun svg{width:100%;height:100%;animation:sky-turn 120s linear infinite}
.sky .sun .rays{animation:sky-rays 1s 1.3s ease-out both}
.sky .sea{position:absolute;inset:var(--hz) 0 0;background:linear-gradient(180deg,#5E4A7E 0%,#2E2862 18%,#1C1844 50%,#120F2C 100%)}
.sky .sea::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:rgba(255,232,180,.55)}
.sky .shine{position:absolute;left:0;right:0;top:6px;display:flex;flex-direction:column;align-items:center;gap:9px;animation:fade .9s 1.3s both}
.sky .shine i{display:block;height:3px;border-radius:3px;background:#F6C46C;opacity:.7;animation:sky-shimmer 2.6s ease-in-out infinite alternate}
.sky-in{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sky-head{height:var(--hz);display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:118px}
.sky-word{font-family:var(--body);font-weight:700;font-size:60px;line-height:1;letter-spacing:-.01em;margin:0;color:#fff}
.sky-word .pro{color:#F6C46C}
.sky-word span{display:inline-block;animation:sky-letter .8s cubic-bezier(.2,.7,.2,1) both}
.sky-tag{margin-top:12px;font-family:var(--display);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#FAD889;animation:fade 1s 1.7s both}
.sky-card{width:100%;max-width:400px;margin-top:34px;padding:22px 20px;border-radius:24px;display:grid;gap:14px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 18px 40px rgba(8,6,24,.35);animation:sky-card .8s 1s cubic-bezier(.2,.7,.2,1) both}
.sky-card p{font-size:17px;line-height:1.45}
.sky-card .muted{color:rgba(255,255,255,.78)}
.sky-card b{color:#FAD889;font-weight:600;word-break:break-all}
.sky-card form{display:grid;gap:10px}
.sky-card .text-in{background:#fff;color:#1E1B2E;border-color:transparent;text-align:center;font-size:19px;min-height:54px}
.sky-card #si-code{font-size:26px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.sky-card .btn.primary{background:#F1B75A;color:#2B1F08;min-height:54px;font-size:17px}
.sky-card .btn.line{border-color:rgba(255,255,255,.35);color:#fff}
.sky-card :focus-visible{outline-color:#FAD889}
.sky-card .sky-big{font-family:var(--display);font-size:26px;line-height:1.2;color:#fff}
.sky-or{display:flex;align-items:center;gap:10px;font-size:14px!important;color:rgba(255,255,255,.65)}
.sky-or::before,.sky-or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.2)}
.sky-card .btn svg{width:22px;height:22px}
.sky-wait{display:inline-flex;align-items:center;gap:10px;justify-self:center}
.sky-hello{font-family:var(--display);font-size:13px!important;letter-spacing:.3em;text-transform:uppercase;color:#FAD889;animation:fade .8s both}
.sky-card .sky-biz{font-family:var(--display);font-size:30px;font-weight:300;line-height:1.15;color:#fff;animation:sky-letter .9s .15s cubic-bezier(.2,.7,.2,1) both}
/* the opening hands over to the book: the sun's glow floods the screen, then the scene fades away */
.signin.veil{z-index:60}
/* setting up a new business on the website: the setup screens fill the screen */
.sheet.full{position:fixed;inset:0!important;left:0!important;transform:none!important;max-height:none!important;height:100%!important;width:100%!important;max-width:none!important;border-radius:0!important;margin:0;animation:fade .2s ease-out!important;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet.full > .grab{display:none}
.sheet.full .ob{max-width:560px;margin-inline:auto;width:100%}
.signin.leaving{animation:sky-out 1.1s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
.signin.leaving .glow{animation:sky-burst 1.1s ease-in forwards}
.signin.leaving .sun{animation:sky-up 1.1s ease-in forwards}
.signin.leaving .sky-in{animation:sky-lift .7s ease-in forwards}
/* the same scene at other times of day */
.signin[data-tod="day"] .sky .air{background:linear-gradient(180deg,#1C5AA6 0%,#2F74C0 40%,#5A9BD8 78%,#8FC2EA 100%)}
.signin[data-tod="day"] .stars{display:none}
.signin[data-tod="day"] .glow{left:50%;bottom:auto;top:calc(var(--hz) * .14 - 95px);width:300px;height:300px;margin-left:-150px;background:radial-gradient(closest-side,rgba(255,244,205,.55),rgba(255,244,205,0))}
.signin[data-tod="day"] .sky .sun{bottom:auto;top:calc(var(--hz) * .14);width:110px;height:110px;margin-left:-55px;animation:sky-noon 1.4s .1s cubic-bezier(.2,.7,.2,1) both}
.signin[data-tod="day"] .sky .sea{background:linear-gradient(180deg,#3E86BD 0%,#25679C 25%,#174C79 60%,#0F3456 100%)}
.signin[data-tod="day"] .sky .sea::before{background:rgba(255,255,255,.6)}
.signin[data-tod="day"] .sky .shine i{background:#fff;opacity:.55}
.signin[data-tod="day"] .sky-tag{color:#fff}
.signin[data-tod="day"] .sky-word .pro{color:#FFD77A}
.signin[data-tod="dusk"] .sky .air{background:linear-gradient(180deg,#1A1440 0%,#3A2462 30%,#7A3B6E 55%,#D0575C 78%,#F08A4A 92%,#F7B267 100%)}
.signin[data-tod="dusk"] .sky .sun{animation:sky-set 2.2s .15s cubic-bezier(.3,.6,.3,1) both}
.signin[data-tod="dusk"] .sky .sun circle{fill:#F39A4E}
.signin[data-tod="dusk"] .sky .sun .rays{stroke:#F7B26E}
.signin[data-tod="dusk"] .glow{background:radial-gradient(closest-side,rgba(246,140,80,.6),rgba(246,140,80,0))}
.signin[data-tod="dusk"] .sky .sea{background:linear-gradient(180deg,#6B3F6E 0%,#3A2558 20%,#1E1640 55%,#120F2C 100%)}
.signin[data-tod="dusk"] .sky .shine i{background:#F39A4E}
.signin[data-tod="night"] .sky .air{background:linear-gradient(180deg,#05040F 0%,#0B0A22 40%,#16133D 78%,#242057 100%)}
.signin[data-tod="night"] .glow{background:radial-gradient(closest-side,rgba(190,196,255,.16),rgba(190,196,255,0))}
.signin[data-tod="night"] .sky .sea{background:linear-gradient(180deg,#2A2660 0%,#1A1745 20%,#0F0D2A 55%,#08071A 100%)}
.signin[data-tod="night"] .sky .sea::before{background:rgba(214,210,240,.35)}
.signin[data-tod="night"] .sky .shine i{background:#D6D2F0;opacity:.4}
.signin[data-tod="night"] .sky-tag{color:#D6D2F0}
.sky .moon{position:absolute;left:62%;top:calc(var(--hz) * .12);width:84px;height:84px;animation:sky-noon 1.6s .1s cubic-bezier(.2,.7,.2,1) both;filter:drop-shadow(0 0 18px rgba(239,235,216,.35))}
.sky .moon svg{width:100%;height:100%}
.signin.leaving .moon{animation:sky-up 1.1s ease-in forwards}
@keyframes sky-noon{from{opacity:0;transform:translateY(24px) scale(.85)}}
@keyframes sky-set{from{transform:translateY(-62%)}}
@keyframes sky-out{0%,40%{opacity:1}100%{opacity:0}}
@keyframes sky-burst{to{transform:scale(7);opacity:1}}
@keyframes sky-up{to{transform:translateY(-40px) scale(1.25)}}
@keyframes sky-lift{to{transform:translateY(-30px);opacity:0}}
/* pull down to refresh and swipe back, on the home screen app */
.pull,.edge{position:fixed;z-index:25;display:grid;place-items:center;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);color:var(--gold);opacity:0;pointer-events:none;transition:opacity .15s}
.pull{top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;width:42px;height:42px;margin-left:-21px;transform:translateY(-50px)}
.edge{top:50%;left:6px;width:38px;height:38px;margin-top:-19px;color:var(--accent)}
.pull svg,.edge svg{width:24px;height:24px}
.pull.go svg{animation:sky-turn .9s linear infinite}
.sky-wait::before{content:"";width:10px;height:10px;border-radius:50%;background:#F6C46C;animation:sky-pulse 1.1s ease-in-out infinite alternate}
@keyframes sky-rise{from{transform:translateY(105%)}}
@keyframes sky-glow{from{opacity:0;transform:scale(.6)}}
@keyframes sky-rays{from{opacity:0;transform:scale(.7)}}
@keyframes sky-turn{to{transform:rotate(360deg)}}
@keyframes sky-twinkle{to{opacity:.15}}
@keyframes sky-shimmer{to{transform:scaleX(.55);opacity:.35}}
@keyframes sky-letter{from{opacity:0;transform:translateY(22px)}}
@keyframes sky-card{from{opacity:0;transform:translateY(26px)}}
@keyframes sky-pulse{to{opacity:.35;transform:scale(.7)}}
.li.wk{grid-template-columns:62px 1fr auto}
.wk-btns{display:flex;flex-direction:column;gap:6px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.wk-go{width:100%;margin-top:10px}
.card.vnote{padding:12px 14px}
.card.vnote p{margin:0 0 4px}
.card.vnote p:last-child{margin:0}
.btn.danger-line{width:100%;margin-top:12px;color:var(--bad)}
.vn-same{width:100%}
.msg-body{font-size:16px;line-height:1.5;white-space:normal}
.wx{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:15px;color:var(--muted)}
.wx svg{width:20px;height:20px;flex:none;color:var(--gold)}
.wx.wet svg,.wx-s.wet svg{color:var(--accent)}
.wx-s{white-space:nowrap}
.wx-s svg{width:15px;height:15px;vertical-align:-3px;margin-right:3px;color:var(--gold)}
.callout.msg-mine{margin-left:28px;background:var(--accent);color:var(--accent-ink)}.msg-mine small{opacity:.75;font-size:13px}
.vn-same .muted{font-weight:500}
.vn-quick{gap:6px}
.rb-what{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rb-what div{display:flex;flex-direction:column;gap:2px}
.cal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.cal-d{border:0;background:var(--sunk);border-radius:10px;min-height:44px;font:inherit;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;font-variant-numeric:tabular-nums}
.cal-d i{font-style:normal;font-size:10px;line-height:8px;height:8px;color:var(--accent);letter-spacing:1px}
.cal-d.off{background:transparent;color:var(--muted);font-weight:400}
.cal-d.now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-d.hint,.cal-ring{box-shadow:inset 0 0 0 2px var(--gold)}
.cal-ring{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px}
.cal-d.cal-tag::after{content:'';position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--warm)}
.cal-d[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal-d[aria-pressed="true"] i{color:var(--accent-ink)}
.cal-d:disabled{opacity:.35}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.answer{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;border-left:0}
.answer .q{font-size:14px;color:var(--muted)}
.answer .a{font-size:18px}
.answer .a b{font-weight:600}
.answer ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* list rows */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.li{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:14px 16px;min-height:64px}
.li + .li{border-top:1px solid var(--line)}
.li.sv{grid-template-columns:1fr auto auto}
.fq h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.fq-q{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.fq-q span{font-size:14px;color:var(--muted)}
.fdoc p{font-size:17px;line-height:1.5;margin:0 0 10px}
.li.call{grid-template-columns:1fr auto;text-decoration:none;color:inherit}
.li.call .who b{white-space:normal;overflow:visible;text-overflow:clip}
.callout a.phone{color:inherit;font-weight:600;text-decoration:none;white-space:nowrap}
.gc-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.45}
.qr-card{background:#fff;color:#1E1B2E;border-radius:24px;padding:18px 18px 22px;display:grid;justify-items:center;gap:4px;text-align:center;box-shadow:var(--shadow)}
.qr-card svg{width:min(100%,300px);height:auto;display:block}
.qr-card b{font-size:19px;margin-top:4px}
.qr-card span{font-size:15px;color:#4A4760}
.li.sv .sv-pr{font-size:17px;font-variant-numeric:tabular-nums}
.li .t{font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.li .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.li .who{min-width:0}
.li .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .who span{color:var(--muted);font-size:15px}
.li.done .who b,.li.done .t{color:var(--muted)}
.li.block{background:var(--sunk)}
.li.gap{background:transparent}
.li.gap .who b{color:var(--accent)}
.li.gap .open{border:1.5px dashed var(--accent);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.li.nowline{display:flex;align-items:center;gap:10px;min-height:0;padding:6px 16px;color:var(--bad);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.li.nowline::after{content:"";flex:1;height:2px;background:var(--bad);border-radius:2px}
.tag{font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warm-soft);color:var(--warm)}
.tag.new{background:var(--sunk);color:var(--ink)}
.tag.next{background:var(--accent);color:var(--accent-ink)}
.tag.fam{background:var(--warm-soft);color:var(--warm)}
.chip.fam{border-color:var(--warm)}
.tag.holi{background:var(--accent-soft);color:var(--accent)}
.day-tags{display:flex;flex-wrap:wrap;gap:6px}
.wk-tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 2px}
.heads{display:flex;align-items:center;gap:10px;background:var(--warm-soft);color:var(--warm);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:500;border:0;text-align:left;width:100%}
.heads::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warm);flex:none}
.day.fam .dn{box-shadow:inset 0 -3px 0 var(--warm)}
.mo-c{position:relative}
.mo-c.fam::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warm)}
.mo-c.holi .mo-d{box-shadow:inset 0 -2px 0 var(--gold)}
.mo-key{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--muted);margin-top:8px}
.mo-key span{display:inline-flex;align-items:center;gap:6px}
.mo-key i{width:8px;height:8px;border-radius:50%;background:var(--warm);display:inline-block}
.mo-key i.h{background:var(--gold);border-radius:2px;height:3px;width:12px}

/* glance */
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glance button{border:0;text-align:left;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.glance .big{font-family:var(--display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
/* today: what's in against what's booked */
.glance .mt{grid-column:1 / -1;display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:10px 12px 14px}
.glance .gl-seg{grid-template-columns:repeat(4,1fr)}
.glance .gl-seg button{font-size:13.5px;min-height:38px;white-space:nowrap;padding:0 2px;align-items:center;justify-content:center;text-align:center;box-shadow:none;border-radius:10px;background:transparent}
.glance .gl-seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.mt-body{border:0;background:transparent;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink);padding:0 4px}
.mt-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.mt-row > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mt-row > span:last-child{text-align:right;align-items:flex-end}
.mt-bar{width:100%;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.mt-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}

/* schedule */
.week{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week b{font-weight:600}
.snav{gap:8px}
.snav b{flex:1;text-align:center;font-size:17px}
.wk{display:flex;flex-direction:column;gap:12px}
.wk-day{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.wk-day.now{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;border:0;background:var(--sunk);padding:11px 14px;color:var(--ink);font-size:15px;text-align:left}
.wk-h span{color:var(--muted);font-size:14px;white-space:nowrap}
.wk-row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 14px;color:var(--ink);font-size:15px}
.wk-row + .wk-row{border-top:1px solid var(--line)}
.wk-row .t{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.wk-row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.wk-row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.wk-row.blk .n{color:var(--muted);font-style:italic}
.wk-row.past{opacity:.7}
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mo-h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.mo-c{aspect-ratio:1;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);padding:0;min-width:0}
.mo-c.out{opacity:.35}
.mo-c.closed{background:transparent;box-shadow:none;color:var(--muted)}
.mo-c.now{box-shadow:inset 0 0 0 2px var(--accent),0 0 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.mo-d{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.mo-n{font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mo-n.past{background:var(--accent-soft);color:var(--accent)}
.mo-e{height:18px;width:6px;display:grid;place-items:center}
.mo-e.blk::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);border-radius:14px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);min-width:0}
.day .dw{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day .dn{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.off .dn{color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .dw{color:inherit;opacity:.8}
.day[aria-pressed="true"] .dots i{background:var(--accent-ink)}
.empty{background:var(--surface);border-radius:20px;padding:24px 16px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}

/* money */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hero{display:flex;flex-direction:column;gap:4px}
.hero .amt{font-family:var(--display);font-size:56px;line-height:1.05;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:16px}
.hero .sub b{color:var(--ink);font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart .bar{fill:var(--accent);opacity:.42}
.chart .bar.on{opacity:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart text{fill:var(--muted);font-family:var(--body);font-size:12px}
.chart text.val{fill:var(--ink);font-weight:600;font-size:13px}
.chart text.on{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .detail{font-size:15px;margin-top:8px}

/* snapshot */
.back{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:4px;padding:6px 0;min-height:40px}
.back svg{width:18px;height:18px}
.snap-hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;isolation:isolate}
.snap-hero .lily{width:180px;right:-56px;top:-60px;color:var(--hero-ink);opacity:.12;z-index:-1}
.snap-go{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-radius:14px}
.snap-go:focus-visible{outline:3px solid var(--hero-ink);outline-offset:4px}
.snap-k{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8;display:flex;align-items:center;gap:6px}
.snap-k svg,.tile .k svg{width:16px;height:16px}
.snap-big{font-family:var(--display);font-weight:300;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.snap-big small{font-size:22px;margin-left:6px}
.delta{display:inline-block;font-size:14px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--hero-btn)}
.yrs{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.yr{display:grid;grid-template-columns:40px 1fr 54px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.yr .tr{height:10px;border-radius:5px;position:relative}
.yr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--hero-ink);opacity:.55}
.yr.cur .tr i{opacity:1}
.yr .tr u{position:absolute;top:0;bottom:0;border-radius:0 5px 5px 0;background:repeating-linear-gradient(45deg,transparent 0 3px,var(--hero-ink) 3px 4.5px);opacity:.55;border:1px dashed var(--hero-ink)}
.yr b{font-weight:700;text-align:right}
.cta{font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.cta svg{width:18px;height:18px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pills button{border:0;border-radius:14px;background:var(--hero-btn);color:inherit;padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.pills b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.pills small{font-size:12.5px;opacity:.85;line-height:1.3}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;text-align:left;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 15px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile.wide{grid-column:1 / -1}
.tile .k{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .big{font-family:var(--display);font-size:32px;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .s{font-size:14px;color:var(--muted);line-height:1.35}
.tile .s b{color:var(--ink);font-weight:600}
.tile.attn{background:var(--warm-soft);box-shadow:none;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.mb{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:64px;margin-top:8px}
.mb i{display:block;background:var(--accent);opacity:.45;border-radius:3px 3px 0 0}
.mb i.slow{background:var(--gold);opacity:.9}
.mb i.now{opacity:1}
.ml{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.ml .now{color:var(--ink);font-weight:700}
.costs{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.cost{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.cost .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.cost .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cost b{text-align:right;font-weight:600}

/* SolePro's own look for businesses without their own colors: dusk indigo and sun gold */
html[data-look="sole"]{
  --bg:#F3F2F7; --surface:#FFFFFF; --sunk:#E7E5EF; --ink:#1E1B2E; --muted:#5D5972; --line:#D8D5E3; --art:#E2AE45;
  --accent:#3A3576; --accent-ink:#FFFFFF; --accent-soft:#E2E0F1;
  --hero-a:#FAD889; --hero-b:#F1B75A; --hero-ink:#2B1F08; --hero-btn:rgba(255,255,255,.45);
  --warm:#865600; --warm-soft:#FBEFD6; --gold:#E0A526;
  --scrim:rgba(20,16,40,.48); --shadow:0 1px 2px rgba(30,25,60,.06),0 6px 18px rgba(30,25,60,.08);
}
@media (prefers-color-scheme: dark){html[data-look="sole"]:not([data-theme="light"]){
  --bg:#12111C; --surface:#1B1A28; --sunk:#252336; --ink:#ECEAF5; --muted:#A6A2BC; --line:#302E44; --art:#6E5A2C;
  --accent:#AAA5F2; --accent-ink:#15132A; --accent-soft:#29264A;
  --hero-a:#3D3016; --hero-b:#2C230F; --hero-ink:#F8E8C3; --hero-btn:rgba(255,255,255,.08);
  --warm:#F0C065; --warm-soft:#3A2E14; --gold:#E8B341; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3)}}
html[data-look="sole"][data-theme="dark"]{
  --bg:#12111C; --surface:#1B1A28; --sunk:#252336; --ink:#ECEAF5; --muted:#A6A2BC; --line:#302E44; --art:#6E5A2C;
  --accent:#AAA5F2; --accent-ink:#15132A; --accent-soft:#29264A;
  --hero-a:#3D3016; --hero-b:#2C230F; --hero-ink:#F8E8C3; --hero-btn:rgba(255,255,255,.08);
  --warm:#F0C065; --warm-soft:#3A2E14; --gold:#E8B341; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3)}
.pill.trade{border:0;display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--ink)}
.pill.trade svg{width:14px;height:14px}
.who-tag{color:var(--accent);font-weight:600}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:36px;height:36px;color:var(--gold)}
.brand b{font-family:var(--display);font-size:30px;font-weight:300;letter-spacing:.02em}
.brand svg.badge{color:inherit}
.brand b.wordmark{font-family:var(--body);font-weight:700;letter-spacing:-.01em}
.wordmark span{color:#D9971C}
:root[data-theme="dark"] .wordmark span{color:#F2B544}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wordmark span{color:#F2B544} }
.trades{display:flex;flex-direction:column;gap:8px}
.trades button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;min-height:60px}
.trades button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.trades b{font-weight:600;display:block}
.trades span span{color:var(--muted);font-size:14px}
.team{display:flex;flex-direction:column;gap:8px;margin-top:6px}

/* business identity in the header */
.biz{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 0;min-height:40px;max-width:72%;color:var(--ink);text-align:left}
.biz-mark{width:30px;height:30px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.02em;flex:none}
.biz-mark img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.biz-mark svg{width:24px;height:24px}
.biz-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.biz svg.chev{width:14px;height:14px;flex:none}
.hdr-right{display:flex;align-items:center;gap:10px;flex:none}
.hdr-top .biz{flex:1 1 auto;min-width:0;max-width:none}
.me{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;letter-spacing:.02em;flex:none;box-shadow:var(--shadow)}
.me.big{width:56px;height:56px;font-size:20px}
.me-who{display:flex;align-items:center;gap:14px}
.me-who div{display:flex;flex-direction:column;gap:2px;min-width:0}
.me-who b{font-size:18px}
.danger-line{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.hdr-date{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
/* setup */
.ob{display:flex;flex-direction:column;gap:16px}
.ob-dots{display:flex;gap:6px}
.ob-dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.ob-dots i.on{background:var(--accent)}
.ob h2{font-size:28px;font-weight:300}
.welcome{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-block:8px}
.welcome .brand svg{width:56px;height:56px}
.welcome .brand b{font-size:48px}
.welcome p{font-size:19px;max-width:30ch}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;cursor:pointer;background:var(--surface);color:var(--muted)}
.drop b{color:var(--accent);font-weight:600}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop img{max-height:96px;max-width:100%;object-fit:contain}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.preview-bar{display:flex;gap:8px;align-items:center;border-radius:14px;padding:12px 14px;font-weight:600}
.docs{display:flex;flex-direction:column;gap:8px}
.docrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.docrow .doc{width:40px;height:46px}
.docrow b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docrow span{font-size:13px;color:var(--muted)}
.prices{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:4px 14px}
.price{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:10px 0}
.price + .price{border-top:1px solid var(--line)}
.price span{font-size:13px;color:var(--muted);display:block}
.price label{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg)}
.price input{width:100%;border:0;background:transparent;font-size:17px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.tradepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tradepick button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;font-weight:600;min-height:52px}
.tradepick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.form-img{max-width:100%;border-radius:12px;box-shadow:var(--shadow)}

/* filling in forms */
.sheet.fill{max-height:100%;height:100%;border-radius:0;gap:16px}
body.form-only .tabbar{display:none}
#offline-bar{position:fixed;inset:0 0 auto;z-index:60;padding:calc(env(safe-area-inset-top) + 6px) 16px 7px;background:var(--warm-soft);color:var(--warm);font-size:14px;line-height:1.35;text-align:center;box-shadow:var(--shadow)}
body.offline .app{padding-top:34px}
.form-page{padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
.fill-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.fill-top b{display:block;font-weight:600}
.fill-top span span,.fill-top div span{color:var(--muted);font-size:14px}
.fill-form{display:flex;flex-direction:column;gap:16px;padding-bottom:12px}
.fill-h{font-size:22px;font-weight:400;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:8px}
.fld > span:first-child{font-weight:600;font-size:16px}
.fld .req{color:var(--bad)}
.fld.missing > span:first-child,.consent.missing span{color:var(--bad)}
.fld.missing .text-in,.fld.missing .sig{border-color:var(--bad)}
.chip.pick{display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.chip.pick input{position:absolute;opacity:0;width:1px;height:1px}
.chip.pick:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.pick:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.consent{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);font-size:15px}
.consent input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px}
.sig{width:100%;height:170px;border:2px dashed var(--line);border-radius:14px;background:#FFFFFF;touch-action:none;display:block}
.sig-img{max-width:100%;height:auto;max-height:120px;background:#FFFFFF;border-radius:8px;border:1px solid var(--line)}
.thanks{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-block:24px}
.thanks .brand svg{width:48px;height:48px;color:var(--gold)}
.thanks h2{font-size:30px;font-weight:300}
.thanks p{font-size:18px}
.notes.resp .fill-h{font-size:17px;margin:4px 0 0;padding-top:12px}

/* getting started */
.getstarted{gap:12px}
.gs-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.gs-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.gs-list{display:flex;flex-direction:column}
.gs{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;border:0;background:transparent;text-align:left;padding:10px 0;min-height:56px;width:100%}
.gs + .gs{border-top:1px solid var(--line)}
.gs b{font-weight:600;display:block}
.gs span span{color:var(--muted);font-size:14px}
.gs-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.gs-dot svg{width:16px;height:16px}
.gs.done{opacity:.6;cursor:default}
.gs.done .gs-dot{background:var(--accent);border-color:var(--accent)}
.gs.done b{text-decoration:line-through;text-decoration-color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:15px;padding:6px 0;text-align:left;min-height:40px}

/* clients in snapshot */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 6px}
.stat3 button{border:0;background:var(--sunk);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;min-width:0}
.stat3 b{font-family:var(--display);font-size:clamp(20px, 6.2vw, 28px);white-space:nowrap;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.stat3 span{font-size:13px;color:var(--muted)}
.tops{display:flex;flex-direction:column;gap:2px}
.topc{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:8px 0;min-height:48px;width:100%}
.topc + .topc{border-top:1px solid var(--line)}
.topc .n{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.topc .nm{display:flex;flex-direction:column;gap:5px;min-width:0}
.topc .nm b{font-weight:600}
.topc .nm i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.5}
.topc:first-child .nm i{opacity:1}
.topc .v{font-weight:700;font-variant-numeric:tabular-nums}
.spend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spend div{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.spend b{font-family:var(--display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.spend span{font-size:13px;color:var(--muted)}
/* forms */
.form{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.form-h{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start}
.doc{width:48px;height:56px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em}
.doc svg{width:22px;height:22px}
.form-h h3{font-size:20px;font-weight:400}
.form-h p{color:var(--muted);font-size:15px;margin-top:2px}
.form .btns3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-more{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:-4px}
.form .btns3 .btn.primary{grid-column:1 / -1}
a.btn{text-decoration:none}
.callout{background:var(--sunk);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.callout b{font-weight:600}

/* year (her records) */
.chart .proj{fill:url(#hatch);stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 3}
.chart .hatch-bg{fill:var(--accent-soft)}
.chart .hatch-ln{stroke:var(--accent);stroke-width:2;opacity:.55}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}
.key i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--accent)}
.key i.p{background:repeating-linear-gradient(45deg,var(--accent-soft) 0 3px,var(--accent) 3px 4.5px)}
.facts2{display:flex;flex-direction:column;gap:10px}
.facts2 p b{font-weight:600}
.season{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.season div{background:var(--sunk);border-radius:14px;padding:12px 14px}
.season b{display:block;font-weight:600}
.step{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 0}
.step + .step{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1;font-weight:500}
.stepper output{min-width:56px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.wi-out{font-size:18px;margin-top:6px}
.wi-out b{font-family:var(--display);font-size:30px;font-weight:400;display:block}
.kept{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.kept th,.kept td{padding:10px 0;text-align:right;border-bottom:1px solid var(--line)}
.kept th:first-child,.kept td:first-child{text-align:left;color:var(--muted);font-weight:500}
.kept th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kept tr:last-child td{border-bottom:0;font-weight:700;color:var(--ink)}
.kept tr:last-child td:first-child{color:var(--ink)}

/* clients */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:17px}
.reach{display:flex;flex-direction:column;gap:10px}
.rc{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 12px 12px 14px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--accent-soft);color:var(--accent)}
.rc .why{color:var(--muted);font-size:15px}
.rc b{font-weight:600}
.rc .btn{min-height:44px;font-size:15px}
.li.client{grid-template-columns:44px 1fr auto}
.li.rm{grid-template-columns:1fr auto}
.li.rm .who{border:0;background:transparent;text-align:left;padding:0;color:var(--ink);display:flex;flex-direction:column}
.btn.sm.primary{min-height:40px;padding:6px 16px}
.linkish{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}
/* Clients tab */
.cl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cl-stats button{border:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;color:var(--ink)}
.cl-stats b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.cl-stats small{font-size:13px;color:var(--muted)}
.cl-stats button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
/* bringing in clients from another app */
.im-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.im-sum div{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.im-sum b{font-family:var(--display);font-size:28px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.im-sum span{font-size:13px;color:var(--muted)}
.im-err{color:var(--bad);background:var(--bad-soft);border-radius:12px;padding:10px 12px;margin:0;font-size:15px}
.im-how,.im-map{border-radius:16px;background:var(--sunk);padding:4px 14px}
.im-how summary,.im-map summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent);cursor:pointer;list-style:none}
.im-how summary::-webkit-details-marker,.im-map summary::-webkit-details-marker{display:none}
.im-how ul{margin:0 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4}
.im-map[open]{padding-bottom:14px}.im-map .field{margin-top:10px}.im-map select{width:100%;min-width:0}
.im-list .li{cursor:default}
.im-sum,.im-list,.im-how,.im-map,.im-err{flex-shrink:0}
.im-link{align-self:center;text-align:center}
.im-empty{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;position:relative;overflow:hidden}
.im-empty h2{margin:0}.im-empty p{margin:0 0 4px}
.cl-chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.cl-chips::-webkit-scrollbar{display:none}
.cl-chips .chip{flex:none}
.cl-chips .chip span{opacity:.6;margin-left:2px}
.cl-group{display:flex;flex-direction:column;gap:6px}
/* A to Z: a strip down the right edge on a phone (tap or slide a finger along it), a row of letters on a computer */
.az{position:fixed;right:max(2px,env(safe-area-inset-right,0px));top:calc(50% + 20px);transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;touch-action:none;
  background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:12px;padding:4px 0;box-shadow:var(--shadow)}
.az button{border:0;background:transparent;color:var(--accent);font-size:11px;font-weight:700;width:22px;height:max(14px,min(19px,calc((100vh - 280px) / 27)));padding:0;line-height:1}
.az ~ #clt-list{padding-right:20px}
.cl-group{scroll-margin-top:calc(var(--hdr-h,120px) + 8px)}
.cl-letter{font-family:var(--display);font-size:20px;color:var(--gold);padding-left:6px}
.av.t1{background:var(--warm-soft);color:var(--warm)}
.av.t2{background:var(--sunk);color:var(--ink)}
.cl-marks{display:flex;align-items:center;gap:6px}
.mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;font-style:normal}
.mk.bad{background:var(--bad-soft);color:var(--bad)}
.mk.warn{background:var(--warm-soft);color:var(--warm)}
.cl-empty{text-align:center;padding:24px 0}
.cl-back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:16px;padding:4px 0}
.cl-back svg{width:20px;height:20px}
.cl-hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);box-shadow:var(--shadow)}
.cl-hero .lily{width:220px;right:-70px;top:-60px;opacity:.35}
.cl-hero .av{width:76px;height:76px;font-size:26px;background:var(--surface);color:var(--accent);box-shadow:0 0 0 4px var(--hero-btn)}
.cl-hero h2{font-size:30px;font-weight:300;margin-top:6px}
.cl-hero p{font-size:15px;opacity:.85}
.cl-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:2px}
.cl-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:12px}
.cl-act{border:0;border-radius:16px;background:var(--hero-btn);color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:13px;font-weight:600;text-decoration:none}
.cl-act svg{width:22px;height:22px}
.cl-act.primary{background:var(--accent);color:var(--accent-ink)}
.cl-next{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;color:var(--ink)}
.cl-next .when{flex:1;min-width:0}
.cl-next b{display:block;font-size:17px}
.cl-next span{font-size:15px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;position:relative;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--line)}
.tl-i{position:relative}
.tl-i::before{content:"";position:absolute;left:-18px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-i.soon::before{background:var(--accent)}
.tl-i.miss::before{border-color:var(--warm)}
.tl-card{width:100%;border:0;text-align:left;color:var(--ink);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.tl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl-date{font-size:14px;color:var(--muted)}
.tl-date b{color:var(--ink);font-weight:600}
.tl-svc{font-weight:600;font-size:16px}
.tl-soap{border-left:3px solid var(--gold);padding-left:10px;display:flex;flex-direction:column;gap:3px;font-size:14.5px;color:var(--ink)}
.tl-soap p{line-height:1.4}
.tl-todo{font-size:14px;font-weight:600;color:var(--accent)}
.cl-files{display:flex;flex-direction:column;gap:8px}
.heads.rec{background:var(--accent-soft);color:var(--accent)}
.heads.rec::before{background:var(--accent)}
.rec-sum{display:flex;flex-direction:column;gap:10px}
#print{display:none}
@media print{
  body > *:not(#print){display:none!important}
  #print{display:block;color:#000;background:#fff;font:12pt/1.45 Georgia,serif;padding:0}
  #print .pr-head{display:flex;justify-content:space-between;border-bottom:1px solid #999;padding-bottom:6pt;margin-bottom:12pt;font-family:Helvetica,Arial,sans-serif;font-size:10pt}
  #print h1{font-size:20pt;margin:0 0 8pt} #print h2{font-size:14pt;margin:16pt 0 6pt} #print h3{font-size:11pt;margin:0 0 4pt;font-family:Helvetica,Arial,sans-serif}
  #print table{border-collapse:collapse;width:100%} #print th,#print td{text-align:left;vertical-align:top;padding:3pt 8pt 3pt 0;border-bottom:1px solid #ddd}
  #print .pr-q{margin:6pt 0;line-height:1.6} #print .pr-blank{display:inline-block;min-width:60%;border-bottom:1px solid #777;height:12pt;vertical-align:bottom} #print .pr-blank.short{min-width:20%}
  #print .pr-visit{break-inside:avoid;padding:6pt 0;border-bottom:1px solid #ddd} #print p{margin:2pt 0} #print .pr-none{color:#666}
}
.cl-file{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;border:0;text-align:left;color:var(--ink);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.cl-file .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.cl-file .fi svg{width:22px;height:22px}
.cl-file.todo .fi{background:var(--warm-soft);color:var(--warm)}
.cl-file b{display:block}
.cl-file span{font-size:14px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .18s ease-out}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);max-height:92%;overflow-y:auto;z-index:21;
  background:var(--bg);border-radius:24px 24px 0 0;

function genHist(y0, base, growth, seed){
  const SEAS = [.86,.9,1.02,1.04,1.02,.98,.9,.92,.94,1.02,1.04,1.12];

  RESP.forEach(r => { if (r.client && CL[r.client]) by[r.client] = by[r.client] || []; });

    .sort((a, b) => CL[a.k].name.localeCompare(CL[b.k].name));

/* ---------- Ask ---------- */
function ask(q){
  const s = q.toLowerCase();
  let a;
  const hit = Object.keys(CL).filter(k => !CL[k].anon).find(k => s.includes(first(k).toLowerCase()) || s.includes(CL[k].name.toLowerCase()));
  const dayHit = () => {
    if (/tomorrow/.test(s)) return 1;
    if (/today/.test(s)) return 0;
    const i = DOW.findIndex(d => s.includes(d.toLowerCase()));
    return i >= 0 ? nextOffWith(1, i) : 1;
  };
  if (hit) {
    const n = nextAppt(hit), c = CL[hit];
    const sp = spend(hit);
    a = `<b>${c.name}</b> was last in ${lastText(hit).toLowerCase()}. ${sp.a.v ? `Spent <b>${money(sp.y.$)}</b> this year and ${money(sp.a.$)} all time. ` : ''}${n ? `Next visit: <b>${whenText(n)}</b>, ${svLabel(n.s)}.` : 'Nothing booked yet.'}
      <div class="btn-row" style="margin-top:10px"><button class="btn" data-act="client" data-c="${hit}">Open notes</button><button class="btn primary" data-act="book" data-c="${hit}">Book</button></div>`;
  } else if (/(year|pace|forecast|project|on track|going)/.test(s)) {
    a = P.fresh ? `Your first year on SolePro started this month. So far you’ve brought in <b>${money(sumOf('month').net)}</b> from ${sumOf('month').n} ${P.unit}. Connect Square or upload past sales and SolePro fills in the rest of your year.` : `You’ve done <b>${SO_FAR} ${P.unit}</b> this year through ${MON[DONE-1]}, worth about <b>${money(SO_FAR*RATE)}</b>. You’re on pace for about <b>${PROJ}</b>, which would beat your best year (${BEST_PAST_Y}, with ${BEST_PAST}).
      <div class="btn-row" style="margin-top:10px"><button class="btn primary" data-act="money" data-v="year">See your year</button></div>`;
  } else if (/(paid|owe|unpaid|charge)/.test(s)) {
    const u = unpaid();
    a = u.length ? `<ul>${u.map(x => `<li><b>${CL[x.c].name}</b>: ${money(prOf(x))} for ${dayName(x.off)}</li>`).join('')}</ul>` : 'Everyone has paid. Nice.';
  } else if (/(open|free|room|available|opening|gap)/.test(s)) {
    const off = dayHit(), g = freeGaps(off);
    a = isOff(off) ? `${cap(dayName(off))} is your day off.` : g.length ? `${cap(dayName(off))} you’re open:<ul>${g.map(([x,y]) => `<li><b>${clock(x)} to ${clock(y)}</b> (${dur(y-x)})</li>`).join('')}</ul>` : `${cap(dayName(off))} is fully booked.`;
  } else if (/(made|make|earn|money|income|tips|took|sales)/.test(s)) {
    const r = /today/.test(s) ? 'today' : /week|7/.test(s) ? 'week' : 'month', t = SQX && SQX.today && r === 'today' ? SQX.today : SQX && SQX.live && r === 'month' ? {...SQX.month, n:SQX.month.orders} : sumOf(r);
    a = `You made <b>${money(t.net)}</b> ${RANGES[r].name}, plus <b>${money(t.tips)}</b> in tips, from ${t.n} sessions.`;
  } else if (/(who|next|schedule|coming)/.test(s)) {
    const n = apptsOn(0).filter(x => x.start >= NOW);
    a = `Still to come today:<ul>${n.map(x => `<li><b>${clock(x.start)}</b> ${CL[x.c].name}, ${svLabel(x.s)}</li>`).join('')}</ul>`;
  } else {
    a = `This sample can answer questions about money, openings, who hasn’t paid, and any ${W1} by name. The real app would answer anything in ${P.booking}.`;
  }
  S.answer = {q, a};
  render();
}

// tomorrow's confirmation text: the business's own wording (PREFS.remind) or this one; [name], [service], [when],

const REMIND_DEFAULT = 'Hi [name]! Just confirming your [service] with me [when]. Reply C to confirm, or let me know if you need to change. See you then! [me], [business]';
const fillMsg = (tpl, x) => tpl.replace(/\[(name|service|when|me|business)\]/gi, (m, w) => x[w.toLowerCase()]).replace(/[ \t]+/g, ' ').trim();
function messageFor(k, kind){
  const f = first(k), sl = soonSlots(2);
  const offer = sl.length > 1 ? `${sl[0]} or ${sl[1]}` : sl[0] || 'some openings this week';
  if (kind === 'lapsed') return `Hi ${f}! It’s been a little while and I’d love to see you. I have ${offer} open. Want one of them?`;
  if (kind === 'bday') return `Happy birthday, ${f}! I hope it’s a great one. If you’d like a ${P.treat} this month, I’ll take $15 off.`;
  if (kind === 'gift') return `Hi ${f}! Just a reminder that you have a ${money(CL[k].gift)} gift card with me. I have ${offer} open if you’d like to use it.`;
  if (kind === 'review') return `Hi ${f}, thank you for coming in today! If you have a minute, a short review on ${P.reviewOn} really helps a small business like mine: ${P.reviewUrl || '[review link]'}`;
  if (kind === 'thanks') { const a = arguments[2], when = !a ? 'in' : a.off === -1 ? 'in yesterday' : `in on ${DOW[dateOf(a.off).getDay()]}`;
    return `Hi ${f}! Thank you for coming ${when}. ${P.reviewUrl ? `If you have a minute, a quick review would mean the world to me: ${P.reviewUrl}` : 'It was so good to see you.'} ${P.owner}`; }
  if (kind === 'confirm' || kind === 'remind' || kind === 'moved') { const a = arguments[2] || nextAppt(k), when = a ? `${dayName(a.off)}${a.off > 6 ? ', ' + dayShort(a.off).slice(4) : ''} at ${clock(a.start)}` : 'soon';
    return kind === 'confirm' ? `Hi ${f}! You’re booked for ${a ? svLabel(a.s) : P.unitOne} ${when}. See you then! ${P.owner}, ${P.biz}`
      : kind === 'moved' ? `Hi ${f}, your ${P.unitOne} is now ${when}. See you then! ${P.owner}`
      : fillMsg(PREFS.remind || REMIND_DEFAULT, {name:f, service:a ? svText(a.s) : P.unitOne, when, me:P.owner, business:P.biz}); }

function sigPad(){

// call straight from the tap: nothing waits before the browser shows Face ID
function pkCeremony(kind){

  if (!pkFresh(kind)) return (kind === 'sign' ? SB.auth.signInWithPasskey() : SB.auth.registerPasskey()).then(check);

  return (kind === 'sign' ? navigator.credentials.get({publicKey}) : navigator.credentials.create({publicKey}))
    .then(c => SB.auth.passkey[kind === 'sign' ? 'verifyAuthentication' : 'verifyRegistration']({challengeId:pre.challenge_id, credential:pkJSON(c)})).then(check);
}

// Square payments from the tables, in the shape the app already reads (square/summary, square/customers, live payments)
function squareShape(pays, names){
  const c = x => ((x || {}).amount || 0) / 100, months = {}, fees = {}, per = {}, now = new Date(), yk = String(now.getFullYear()), mk = isoDay(now).slice(0,7);
  pays.filter(p => p.status === 'COMPLETED').forEach(p => {
    const d = new Date(p.created_at), day = isoDay(d), m = day.slice(0,7), back = c(p.refunded_money), net = Math.max(0, c(p.amount_money) - back), tip = c(p.tip_money);
    const mo = months[m] || (months[m] = {net:0, tips:0, collected:0, orders:0}); mo.net += net; mo.tips += tip; mo.collected += Math.max(0, c(p.total_money) - back); mo.orders++;
    fees[day.slice(0,4)] = (fees[day.slice(0,4)] || 0) + (p.processing_fee || []).reduce((t, f) => t + c(f.amount_money), 0);
    if (p.customer_id) { const x = per[p.customer_id] || (per[p.customer_id] = {id:p.customer_id, name:names[p.customer_id] || null, all:{n:0, net:0, tips:0}, year:{n:0, net:0, tips:0}, month:{n:0, net:0}, last:''});
      x.all.n++; x.all.net += net; x.all.tips += tip; if (day.startsWith(yk)) { x.year.n++; x.year.net += net; x.year.tips += tip; } if (m === mk) { x.month.n++; x.month.net += net; } if (day > x.last) x.last = day; }
  });
  const iso = now.toISOString();
  return {summary:{updated:iso, through:isoDay(now), source:'Square', months, fees, days:{}}, customers:Object.values(per).sort((a, b) => b.all.net - a.all.net)};
}
async function loadAll(q){ let out = [], from = 0; for (;;) { const { data, error } = await q().range(from, from + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) return out; from += 1000; } }

// the claude.ai calls the app makes, answered from Supabase
function cloudDb(){
  const itemCols = ['appts', 'blocks', 'clients', 'ledger', 'visits', 'weeks', 'forms', 'people', 'days', 'inbox'];
  const listeners = {};
  const snap = (id, data) => ({id, exists:data != null, data:() => data});
  const docRef = (col, id) => ({
    id,
    async get(){
      if (col === 'square') { const sh = squareShape([...SQ_CACHE.pays.values()], SQ_CACHE.names); return id === 'summary' ? (SQ_CACHE.pays.size ? snap(id, sh.summary) : snap(id, null)) : snap(id, {list:sh.customers}); }
      const { data, error } = await SB.from('items').select('data').eq('business_id', BIZ).eq('col', col).eq('id', id).maybeSingle(); if (error) throw error; keep(col, id, data ? data.data : null); return snap(id, data ? data.data : null); },
    async set(data){ const { error } = await SB.from('items').upsert({business_id:BIZ, col, id, data, updated_at:new Date().toISOString()}); if (error) throw error; keep(col, id, data); },
    async delete(){ const { error } = await SB.from('items').delete().eq('business_id', BIZ).eq('col', col).eq('id', id); if (error) throw error; keep(col, id, null); },
  });
  const keep = (col, id, data) => { const m = BOOK_ROWS[col] = BOOK_ROWS[col] || {}; if (data == null) delete m[id]; else m[id] = data; bookSaveSoon(); };
  SB.channel('book-' + BIZ).on('postgres_changes', {event:'*', schema:'public', table:'items', filter:`business_id=eq.${BIZ}`}, ev => {
    const row = ev.eventType === 'DELETE' ? ev.old : ev.new; if (row && row.col) keep(row.col, row.id, ev.eventType === 'DELETE' ? null : row.data); (listeners[row.col] || []).forEach(fn => fn({docChanges:() => [{type:ev.eventType === 'DELETE' ? 'removed' : 'modified', doc:snap(row.id, ev.eventType === 'DELETE' ? null : row.data)}]}));
  }).subscribe();
  return {
    doc:path => { const [col, id] = path.split('/'); return docRef(col, id); },
    collection:col => ({
      doc:id => docRef(col, id),
      async get(){ if (!itemCols.includes(col)) return {docs:[]}; const rows = await loadAll(() => SB.from('items').select('id,data').eq('business_id', BIZ).eq('col', col));
        BOOK_ROWS[col] = Object.fromEntries(rows.map(r => [r.id, r.data])); return {docs:rows.map(r => snap(r.id, r.data))}; },
      onSnapshot(next){ (listeners[col] = listeners[col] || []).push(next); return () => { listeners[col] = listeners[col].filter(f => f !== next); }; },
      async setMany(L){ const at = new Date().toISOString(), { error } = await SB.from('items').upsert(L.map(([id, data]) => ({business_id:BIZ, col, id, data, updated_at:at}))); if (error) throw error; L.forEach(([id, d]) => keep(col, id, d)); },
      async delMany(ids){ const { error } = await SB.from('items').delete().eq('business_id', BIZ).eq('col', col).in('id', ids); if (error) throw error; ids.forEach(id => keep(col, id, null)); },
    }),
  };
}
/* ---------- no signal: the phone's own copy of the book ----------

async function bookSave(){

function offlineDb(c){

  const write = async (col, id, data) => { const m = rows[col] = rows[col] || {}; if (data == null) delete m[id]; else m[id] = data;
    const q = (await idbGet('pending')) || []; q.push({col, id, data:data == null ? null : data}); await idbSet('pending', q); await idbSet('book', c); offlineBar(); };

    async get(){ if (col === 'square') { const sh = squareShape([...SQ_CACHE.pays.values()], SQ_CACHE.names); return id === 'summary' ? (SQ_CACHE.pays.size ? snap(id, sh.summary) : snap(id, null)) : snap(id, {list:sh.customers}); }
      return snap(id, (rows[col] || {})[id] ?? null); },
    set:data => write(col, id, JSON.parse(JSON.stringify(data))), delete:() => write(col, id, null)});
  return {doc:path => { const [col, id] = path.split('/'); return docRef(col, id); },
    collection:col => ({doc:id => docRef(col, id), async get(){ return {docs:Object.entries(rows[col] || {}).map(([id, d]) => snap(id, d))}; }, onSnapshot(){ return () => {}; }})};
}

async function cloudOffline(c){
  OFFLINE = c; BIZ = c.biz.id; USER_EMAIL = c.who || '';

// changes made with no signal, saved now in the order they were made
async function savePending(){
  const q = (await idbGet('pending')) || []; if (!q.length) return;
  for (const x of q) {
    const { error } = x.data == null ? await SB.from('items').delete().eq('business_id', BIZ).eq('col', x.col).eq('id', x.id)
      : await SB.from('items').upsert({business_id:BIZ, col:x.col, id:x.id, data:x.data, updated_at:new Date().toISOString()});
    if (error) throw error;
  }
