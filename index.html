<title>Sole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column. Sticky header with the date, one screen per tab, a fixed tab bar with four big targets, bottom sheets for details and booking.
   Look taken from her business cards: sea-glass blue ground, aqua for the next client, gold foil for anything that needs her, thin geometric type, a line-drawn flower. */
:root{
  --bg:#E3ECED; --surface:#F8FBFB; --sunk:#D2E0E2; --ink:#1C3335; --muted:#52696C; --line:#C2D4D7; --art:#8FB1B9;
  --accent:#2B686C; --accent-ink:#FFFFFF; --accent-soft:#CDE3E1;
  --hero-a:#A9CFC6; --hero-b:#8CBBB1; --hero-ink:#163033; --hero-btn:rgba(255,255,255,.42);
  --warm:#856519; --warm-soft:#F0E7CF; --gold:#BE9A45; --bad:#9E3426; --bad-soft:#F5DCD7;
  --scrim:rgba(14,30,32,.48);
  --shadow:0 1px 2px rgba(20,45,48,.06),0 6px 18px rgba(20,45,48,.07);
  --display:"Josefin Sans","Avenir Next","Century Gothic",Futura,sans-serif;
  --body:"Jost","Avenir Next",Futura,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E191B; --surface:#162325; --sunk:#1E2F31; --ink:#E2EDED; --muted:#98AEB0; --line:#293C3F; --art:#3E5A5F;
  --accent:#8CC8BF; --accent-ink:#0C1B1C; --accent-soft:#1C3A3A;
  --hero-a:#24453F; --hero-b:#1B3632; --hero-ink:#E6F2EF; --hero-btn:rgba(255,255,255,.09);
  --warm:#DCBB68; --warm-soft:#332B16; --gold:#C9A653; --bad:#F0907F; --bad-soft:#3D221D;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E191B; --surface:#162325; --sunk:#1E2F31; --ink:#E2EDED; --muted:#98AEB0; --line:#293C3F; --art:#3E5A5F;
  --accent:#8CC8BF; --accent-ink:#0C1B1C; --accent-soft:#1C3A3A;
  --hero-a:#24453F; --hero-b:#1B3632; --hero-ink:#E6F2EF; --hero-btn:rgba(255,255,255,.09);
  --warm:#DCBB68; --warm-soft:#332B16; --gold:#C9A653; --bad:#F0907F; --bad-soft:#3D221D;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.hdr{overflow:hidden;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 12px}
.hdr > div{flex:1;min-width:0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.hdr-top .eyebrow{margin:0}
.hdr h1{font-size:32px;line-height:1.1;font-weight:300}
.hdr h1::after{content:"";display:block;width:44px;height:2px;background:var(--gold);margin-top:10px;border-radius:2px}
.lily{position:absolute;pointer-events:none;color:var(--art)}
.hdr .lily{width:170px;right:-46px;top:-34px;opacity:.7;z-index:-1}
.hdr{isolation:isolate}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}

main{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:22px}
.sec-h .aside{font-size:14px;color:var(--muted)}
.lede{font-size:19px;color:var(--ink)}
.lede b{font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}

.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.next{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.next .lily{width:190px;right:-60px;bottom:-70px;color:var(--hero-ink);opacity:.14;z-index:-1}
.next .eyebrow{color:inherit;opacity:.8;margin:0}
.next h2{font-size:28px;font-weight:400}
.next .facts{display:flex;flex-direction:column;gap:6px;font-size:16px}
.next .facts span{display:flex;gap:8px;align-items:flex-start}
.next .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next .btn{background:var(--hero-btn);color:inherit}

.btn{min-height:50px;border:0;border-radius:14px;padding:10px 14px;font-weight:600;font-size:16px;background:var(--sunk);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.warm{background:var(--warm);color:var(--surface)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.line{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* needs-you cards */
.need{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--warm-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:18px;padding:14px 14px 14px 16px}
.need p:first-child{font-weight:600}
.need .btn{min-height:44px;font-size:15px;background:var(--surface);color:var(--ink)}
.need.req{grid-template-columns:1fr}
.need.req .btn-row .btn.primary{background:var(--accent);color:var(--accent-ink)}

/* ask */
.ask{display:flex;gap:8px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:6px 6px 6px 14px;align-items:center}
.ask input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:17px;outline:none}
.ask button{width:44px;height:44px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.ask svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px;font-size:15px;font-weight:500;color:var(--ink);min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.dim{opacity:.5}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}
.answer{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;border-left:0}
.answer .q{font-size:14px;color:var(--muted)}
.answer .a{font-size:18px}
.answer .a b{font-weight:600}
.answer ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* list rows */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.li{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:14px 16px;min-height:64px}
.li + .li{border-top:1px solid var(--line)}
.li .t{font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.li .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.li .who{min-width:0}
.li .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .who span{color:var(--muted);font-size:15px}
.li.done .who b,.li.done .t{color:var(--muted)}
.li.block{background:var(--sunk)}
.li.gap{background:transparent}
.li.gap .who b{color:var(--accent)}
.li.gap .open{border:1.5px dashed var(--accent);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.li.nowline{display:flex;align-items:center;gap:10px;min-height:0;padding:6px 16px;color:var(--bad);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.li.nowline::after{content:"";flex:1;height:2px;background:var(--bad);border-radius:2px}
.tag{font-size:13px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warm-soft);color:var(--warm)}
.tag.new{background:var(--sunk);color:var(--ink)}
.tag.next{background:var(--accent);color:var(--accent-ink)}

/* glance */
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glance button{border:0;text-align:left;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.glance .big{font-family:var(--display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}

/* schedule */
.week{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week b{font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);border-radius:14px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);min-width:0}
.day .dw{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day .dn{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.off .dn{color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .dw{color:inherit;opacity:.8}
.day[aria-pressed="true"] .dots i{background:var(--accent-ink)}
.empty{background:var(--surface);border-radius:20px;padding:24px 16px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}

/* money */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hero{display:flex;flex-direction:column;gap:4px}
.hero .amt{font-family:var(--display);font-size:56px;line-height:1.05;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:16px}
.hero .sub b{color:var(--ink);font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.chart .bar{fill:var(--accent);opacity:.42}
.chart .bar.on{opacity:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart text{fill:var(--muted);font-family:var(--body);font-size:12px}
.chart text.val{fill:var(--ink);font-weight:600;font-size:13px}
.chart text.on{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .detail{font-size:15px;margin-top:8px}

/* snapshot */
.back{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:4px;padding:6px 0;min-height:40px}
.back svg{width:18px;height:18px}
.snap-hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;isolation:isolate}
.snap-hero .lily{width:180px;right:-56px;top:-60px;color:var(--hero-ink);opacity:.12;z-index:-1}
.snap-go{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-radius:14px}
.snap-go:focus-visible{outline:3px solid var(--hero-ink);outline-offset:4px}
.snap-k{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8;display:flex;align-items:center;gap:6px}
.snap-k svg,.tile .k svg{width:16px;height:16px}
.snap-big{font-family:var(--display);font-weight:300;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.snap-big small{font-size:22px;margin-left:6px}
.delta{display:inline-block;font-size:14px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--hero-btn)}
.yrs{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.yr{display:grid;grid-template-columns:40px 1fr 54px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.yr .tr{height:10px;border-radius:5px;position:relative}
.yr .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--hero-ink);opacity:.55}
.yr.cur .tr i{opacity:1}
.yr .tr u{position:absolute;top:0;bottom:0;border-radius:0 5px 5px 0;background:repeating-linear-gradient(45deg,transparent 0 3px,var(--hero-ink) 3px 4.5px);opacity:.55;border:1px dashed var(--hero-ink)}
.yr b{font-weight:700;text-align:right}
.cta{font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.cta svg{width:18px;height:18px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pills button{border:0;border-radius:14px;background:var(--hero-btn);color:inherit;padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.pills b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.pills small{font-size:12.5px;opacity:.85;line-height:1.3}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;text-align:left;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 15px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile.wide{grid-column:1 / -1}
.tile .k{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .big{font-family:var(--display);font-size:32px;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .s{font-size:14px;color:var(--muted);line-height:1.35}
.tile .s b{color:var(--ink);font-weight:600}
.tile.attn{background:var(--warm-soft);box-shadow:none;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.mb{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:64px;margin-top:8px}
.mb i{display:block;background:var(--accent);opacity:.45;border-radius:3px 3px 0 0}
.mb i.slow{background:var(--gold);opacity:.9}
.mb i.now{opacity:1}
.ml{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.ml .now{color:var(--ink);font-weight:700}
.costs{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.cost{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.cost .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.cost .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cost b{text-align:right;font-weight:600}

/* Sole's own look for businesses without their own colors: dusk indigo and sun gold */
html[data-look="sole"]{
  --bg:#F3F2F7; --surface:#FFFFFF; --sunk:#E7E5EF; --ink:#1E1B2E; --muted:#5D5972; --line:#D8D5E3; --art:#E2AE45;
  --accent:#3A3576; --accent-ink:#FFFFFF; --accent-soft:#E2E0F1;
  --hero-a:#FAD889; --hero-b:#F1B75A; --hero-ink:#2B1F08; --hero-btn:rgba(255,255,255,.45);
  --warm:#865600; --warm-soft:#FBEFD6; --gold:#E0A526;
  --scrim:rgba(20,16,40,.48); --shadow:0 1px 2px rgba(30,25,60,.06),0 6px 18px rgba(30,25,60,.08);
}
@media (prefers-color-scheme: dark){html[data-look="sole"]:not([data-theme="light"]){
  --bg:#12111C; --surface:#1B1A28; --sunk:#252336; --ink:#ECEAF5; --muted:#A6A2BC; --line:#302E44; --art:#6E5A2C;
  --accent:#AAA5F2; --accent-ink:#15132A; --accent-soft:#29264A;
  --hero-a:#3D3016; --hero-b:#2C230F; --hero-ink:#F8E8C3; --hero-btn:rgba(255,255,255,.08);
  --warm:#F0C065; --warm-soft:#3A2E14; --gold:#E8B341; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3)}}
html[data-look="sole"][data-theme="dark"]{
  --bg:#12111C; --surface:#1B1A28; --sunk:#252336; --ink:#ECEAF5; --muted:#A6A2BC; --line:#302E44; --art:#6E5A2C;
  --accent:#AAA5F2; --accent-ink:#15132A; --accent-soft:#29264A;
  --hero-a:#3D3016; --hero-b:#2C230F; --hero-ink:#F8E8C3; --hero-btn:rgba(255,255,255,.08);
  --warm:#F0C065; --warm-soft:#3A2E14; --gold:#E8B341; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3)}
.pill.trade{border:0;display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--ink)}
.pill.trade svg{width:14px;height:14px}
.who-tag{color:var(--accent);font-weight:600}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:36px;height:36px;color:var(--gold)}
.brand b{font-family:var(--display);font-size:30px;font-weight:300;letter-spacing:.02em}
.trades{display:flex;flex-direction:column;gap:8px}
.trades button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;min-height:60px}
.trades button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.trades b{font-weight:600;display:block}
.trades span span{color:var(--muted);font-size:14px}
.team{display:flex;flex-direction:column;gap:8px;margin-top:6px}

/* business identity in the header */
.biz{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 0;min-height:40px;max-width:72%;color:var(--ink);text-align:left}
.biz-mark{width:30px;height:30px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.02em;flex:none}
.biz-mark img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.biz-mark svg{width:24px;height:24px}
.biz-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.biz svg.chev{width:14px;height:14px;flex:none}
.hdr-date{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
/* setup */
.ob{display:flex;flex-direction:column;gap:16px}
.ob-dots{display:flex;gap:6px}
.ob-dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.ob-dots i.on{background:var(--accent)}
.ob h2{font-size:28px;font-weight:300}
.welcome{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-block:8px}
.welcome .brand svg{width:56px;height:56px}
.welcome .brand b{font-size:48px}

function logoColors(img){

  Object.values(bins).sort((a,b) => b.n - a.n).forEach(b => {
    const [h, sat, l] = hexToHsl(b.hex);
    if (out.length < 5 && out.every(o => { const [h2, s2, l2] = hexToHsl(o); return Math.min(Math.abs(h-h2), 360-Math.abs(h-h2)) > 22 || Math.abs(l-l2) > 22 || Math.abs(sat-s2) > 30; })) out.push(b.hex);

}

  $('#hdr').innerHTML = `${MOTIF}<div><div class="hdr-top"><button class="biz" data-act="trade" aria-label="Switch business"><span class="biz-mark">${BIZMARK}</span><span class="biz-name">${esc(P.biz)}</span>${I.down.replace('<svg', '<svg class="chev"')}</button><span class="hdr-date">${dayShort(0).slice(0,3)}, ${MON[T0.getMonth()].slice(0,3)} ${T0.getDate()}</span></div><h1>${TITLES[S.tab]}</h1></div>`;
  $('#main').innerHTML = ({today:viewToday, schedule:viewSchedule, money:viewMoney, forms:viewForms})[S.tab]();
  const owes = unpaid().length > 0;
  saveState();
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button class="tab" data-act="tab" data-v="${k}" aria-current="${S.tab===k?'page':'false'}"><span class="${k==='money'&&owes?'badge':''}">${I[k]}</span>${l}</button>`).join('');
}

/* ---------- Today ---------- */
function viewToday(){
  const ap = apptsOn(0);
  const end = ap.length ? Math.max(...ap.map(endOf)) : 0;
  const next = ap.find(a => a.start >= NOW);
  const left = ap.filter(a => a.start >= NOW).length;
  const needs = [];
  if (REQ.open) needs.push(`<div class="need req"><div><p>${CL[REQ.c].name} asked for ${cap(dayName(REQ.off))} at ${clock(REQ.start)}</p><p class="small muted">${svLabel(REQ.s)} · booked online</p></div>
    <div class="btn-row"><button class="btn primary" data-act="req-ok">Accept</button><button class="btn" data-act="req-other">Offer another time</button></div></div>`);
  unpaid().forEach(a => needs.push(`<div class="need"><div><p>${CL[a.c].name} hasn’t paid</p><p class="small muted">${cap(dayName(a.off))} · ${svLabel(a.s)} · ${money(SV[a.s].price)}</p></div><button class="btn" data-act="charge" data-id="${a.id}">Charge ${money(SV[a.s].price)}</button></div>`));
  ap.filter(a => !CL[a.c].intake && a.start >= NOW).forEach(a => needs.push(`<div class="need"><div><p>${first(a.c)}’s ${P.intakeName} is missing</p><p class="small muted">First visit today at ${clock(a.start)}</p></div><button class="btn" data-act="fillfor" data-c="${a.c}">Fill in now</button></div>`));
  const c = next && CL[next.c];
  const mins = next ? next.start - NOW : 0;
  const wk = sumOf('week'), td = sumOf('today');
  return `
  ${P.fresh ? setupCard() : ''}<section class="sec"><p class="lede">${ap.length ? `<b>${ap.length} ${ap.length === 1 ? W1 : WN} today.</b> ${left ? `${left} still to come. Your last one ends at ${clock(end)}.` : 'All done for the day.'}` : `<b>Nothing booked today.</b> ${Object.keys(CL).length ? 'Book someone, or block time for yourself.' : `Add your first ${W1} to get going.`}`}</p></section>
  <section class="sec">
    <form class="ask" id="ask-form"><input id="ask-in" placeholder="Ask anything about your day…" autocomplete="off" aria-label="Ask a question"><button aria-label="Ask">${I.send}</button></form>
    <div class="chips">${askChips().map(q => `<button class="chip" data-act="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    ${S.answer ? `<div class="answer"><p class="q">${esc(S.answer.q)}</p><div class="a">${S.answer.a}</div></div>` : ''}
  </section>
  ${next ? `<section class="next" aria-label="Next ${W1}">${MOTIF}
    <p class="eyebrow">Next · ${clock(next.start)} · in ${dur(mins)}</p>
    <h2>${c.name}</h2>
    <div class="facts">
      <span>${svLabel(next.s)}${c.rows ? '' : ` · ${pressureWord(c.pressure)} pressure`}${MULTI ? ` · with ${next.w}` : ''}</span>
      ${rowsOf(c).filter(r => !r.meter).sort((x,y) => (y.bad?1:0) - (x.bad?1:0)).slice(0,3).map(r => r.bad ? `<span><b>${r.l}: ${esc(r.v)}</b></span>` : `<span>${r.l}: ${esc(r.v)}</span>`).join('')}
    </div>
    <div class="btns"><button class="btn" data-act="appt" data-id="${next.id}">All notes</button><button class="btn" data-act="late" data-id="${next.id}">Running late</button></div>
  </section>` : ''}
  ${needs.length ? `<section class="sec"><div class="sec-h"><h2>Needs you</h2><span class="aside">${needs.length}</span></div>${needs.join('')}</section>` : ''}
  <section class="sec" ${ap.length ? '' : 'hidden'}><div class="sec-h"><h2>Today’s ${WN}</h2><button class="chip" data-act="tab" data-v="schedule">Full schedule</button></div>
    <div class="list">${dayRows(0)}</div></section>
  <section class="glance">
    <button data-act="money" data-v="today"><span class="small muted">Today so far</span><span class="big">${money(td.net)}</span><span class="small muted">+ ${money(td.tips)} tips</span></button>
    ${P.fresh ? `<button data-act="money" data-v="month"><span class="small muted">This month</span><span class="big">${money(sumOf('month').net)}</span><span class="small muted">${sumOf('month').n} ${sumOf('month').n === 1 ? P.unitOne : P.unit} paid</span></button>`
      : `<button data-act="money" data-v="year"><span class="small muted">This year</span><span class="big">${SO_FAR}</span><span class="small muted">${P.unit} · on pace for ${PROJ}</span></button>`}
  </section>`;
}
const pressureWord = p => ['Not known','Light','Light','Medium','Firm','Firm'][p];   // her intake form: Light, Medium, Firm
const pressureLvl = p => [0,1,1,2,3,3][p];
/* the getting-started list a new business sees until it's done */
function setupSteps(){
  return [
    {done:Object.keys(CL).length > 0, t:`Add your first ${W1}`, s:'Name and phone. Notes can come later.', act:'addc'},
    {done:AP.length > 0, t:`Book your first ${P.unitOne}`, s:'Pick who, what and when.', act:'book'},
    {done:!!DONE_STEPS.square, t:'Get paid with Square', s:'Payments and tips show up here by themselves.', act:'connect', v:'square'},
    {done:!!DONE_STEPS.cal, t:'Bring in your calendar', s:'From the booking app you use now, or book everything in Sole.', act:'connect', v:'cal'},
    {done:!!DONE_STEPS.forms, t:`Check your ${P.intakeName}`, s:'Make sure it says what you need before you send it.', act:'checkforms'},
    {done:!!(ACC && ACC.license), t:'Add your license', s:'Sole reminds you before it renews.', act:'addlicense'},
  ];
}
function setupCard(){
  const st = setupSteps(), n = st.filter(x => x.done).length;
  if (n === st.length) return '';
  return `<section class="card sec getstarted"><div class="sec-h"><h2>Get set up</h2><span class="aside">${n} of ${st.length} done</span></div>
    <div class="gs-bar"><i style="width:${n / st.length * 100}%"></i></div>
    <div class="gs-list">${st.map(x => `<button class="gs ${x.done ? 'done' : ''}" data-act="${x.act}" ${x.v ? `data-v="${x.v}"` : ''} ${x.done ? 'disabled' : ''}><span class="gs-dot">${x.done ? I.check : ''}</span><span><b>${x.t}</b><span>${x.s}</span></span>${x.done ? '' : I.chev}</button>`).join('')}</div>
    <button class="linkbtn" data-act="fillsample">Or fill ${esc(P.biz)} with sample data to look around</button></section>`;
}
function rowsOf(c){
  if (c.rows) return [...c.rows.map(([l,v]) => ({l, v})), ...(c.avoid ? [{l:'Avoid', v:c.avoid, bad:true}] : [])];
  const r = [{l:'Pressure', v:c.pressure, meter:true}, {l:'Focus', v:c.focus}];
  if (c.avoid) r.push({l:'Avoid', v:c.avoid, bad:true});
  if (c.reason) r.push({l:'Comes for', v:c.reason});
  if (c.health) r.push({l:'Health', v:c.health, bad:true});
  if (c.setup) r.push({l:'Table', v:c.setup});
  return r;
}
const askChips = () => P.fresh ? ['How’s my year going?', 'What’s open tomorrow?', 'Who hasn’t paid?'] : ['How’s my year going?', 'Who hasn’t paid?', `What’s open ${dayName(REQ.off)}?`, `How much has ${P.askName} spent?`];

/* ---------- rows shared by Today and Schedule ---------- */
function dayRows(off){
  const items = [
    ...(S.tab === 'schedule' ? apptsFor(off) : apptsOn(off)).map(a => ({t:a.start, a})),
    ...BL.filter(b => b.off === off && (!MULTI || S.tab !== 'schedule' || b.w === S.who)).map(b => ({t:b.start, b})),
  ];
  if (S.tab === 'schedule') freeGaps(off, S.who).forEach(g => items.push({t:g[0], g}));
  items.sort((x,y) => x.t - y.t);
  let out = '', nowShown = off !== 0;
  for (const it of items) {
    if (!nowShown && it.t >= NOW) { out += `<div class="li nowline">Now · ${clock(NOW)}</div>`; nowShown = true; }
    if (it.a) {
      const a = it.a, c = CL[a.c], done = off < 0 || (off === 0 && endOf(a) <= NOW);
      let tag = '';
      if (done) tag = a.paid ? '<span class="tag ok">Paid</span>' : '<span class="tag warn">Not paid</span>';
      else if (!c.intake) tag = '<span class="tag warn">Form missing</span>';
      else if (c.isNew) tag = '<span class="tag new">New</span>';
      out += `<button class="li${done?' done':''}" data-act="appt" data-id="${a.id}"><span class="t">${clockS(a.start)}<small>${SV[a.s].min} min</small></span><span class="who"><b>${c.name}</b><span>${SV[a.s].name}${MULTI && S.tab !== 'schedule' ? ` · <span class="who-tag">${a.w}</span>` : ''}${rowsOf(c).some(r => r.bad)?' · <span style="color:var(--bad)">see notes</span>':''}</span></span>${tag || I.chev}</button>`;
    } else if (it.b) {
      out += `<button class="li block" data-act="block" data-id="${it.b.id}"><span class="t">${clockS(it.b.start)}<small>${it.b.min} min</small></span><span class="who"><b>${esc(it.b.label)}</b><span>Blocked</span></span>${I.chev}</button>`;
    } else {
      const [a,b] = it.g;
      out += `<button class="li gap" data-act="gap" data-off="${off}" data-t="${a}"><span class="t">${clockS(a)}</span><span class="who"><b>Open until ${clock(b)}</b><span>${dur(b-a)} free</span></span><span class="open">Book</span></button>`;
    }
  }
  if (!nowShown) out += `<div class="li nowline">Now · ${clock(NOW)}</div>`;
  return out || `<div class="li"><span></span><span class="who muted">Nothing booked yet.</span></div>`;
}

/* ---------- Schedule ---------- */
function viewSchedule(){
  const start = S.week * 7, days = Array.from({length:7}, (_,i) => start + i);
  const off = S.day, ap = apptsFor(off), open = openMin(off, S.who);
  const strip = days.map(o => {
    const d = dateOf(o), n = apptsFor(o).length, offd = isOff(o);
    return `<button class="day${offd?' off':''}" data-act="day" data-v="${o}" aria-pressed="${o===off}" aria-label="${dayLong(o)}"><span class="dw">${o===0?'Today':DOW[d.getDay()].slice(0,3)}</span><span class="dn">${d.getDate()}</span><span class="dots">${offd?'':'<i></i>'.repeat(Math.min(n,4))}</span></button>`;
  }).join('');
  const a0 = dateOf(start), a6 = dateOf(start + 6);
  const range = `${MON[a0.getMonth()].slice(0,3)} ${a0.getDate()} – ${a0.getMonth()===a6.getMonth()?'':MON[a6.getMonth()].slice(0,3)+' '}${a6.getDate()}`;
  return `
  ${MULTI ? `<div class="seg" role="group" aria-label="Whose schedule" style="grid-template-columns:repeat(${P.team.length},1fr)">${P.team.map(t => `<button data-act="who" data-v="${t}" aria-pressed="${S.who===t}">${t}</button>`).join('')}</div>` : ''}
  <section class="sec">
    <div class="week"><button class="iconbtn" data-act="week" data-v="-1" ${S.week===0?'disabled':''} aria-label="Previous week">${I.left}</button><b>${S.week===0?'This week':range}</b><button class="iconbtn" data-act="week" data-v="1" ${S.week>=4?'disabled':''} aria-label="Next week">${I.right}</button></div>
    <div class="strip">${strip}</div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>${off===0?'Today':dayLong(off)}</h2><span class="aside">${isOff(off)?'Day off':`${ap.length} ${ap.length===1?W1:WN} · ${open?dur(open)+' open':'full'}`}</span></div>
    ${isOff(off) ? `<div class="empty">Weekends are your days off.</div>` : `<div class="list">${dayRows(off)}</div>`}
  </section>
  <section class="btn-row"><button class="btn primary" data-act="book">${I.plus}Book a ${W1}</button><button class="btn" data-act="blockt">Block time</button></section>`;
}

/* ---------- Money ---------- */
function viewMoney(){
  if (S.money === 'home') return viewSnap();
  const back = `<button class="back" data-act="snap">${I.left}Snapshot</button>`;
  return back + (S.money === 'year' ? viewYear() : S.money === 'clients' ? viewClients() : dayMoney());
}
function dayMoney(){
  const t = sumOf(S.range), per = t.n ? t.net / t.n : 0;
  const owe = unpaid();
  const paid = AP.filter(a => a.paid && a.off <= 0).sort((x,y) => y.off - x.off || y.start - x.start).slice(0, 6);
  return `
  ${seg()}
  <section class="hero">
    <p class="eyebrow">You made ${RANGES[S.range].name}</p>
    <p class="amt">${money(t.net)}</p>
    <p class="sub num"><span><b>+ ${money(t.tips)}</b> in tips</span><span><b>${t.n}</b> sessions</span>${t.n?`<span><b>${money(per)}</b> each</span>`:''}</p>
  </section>
  <section class="card chart">${chart()}</section>
  ${owe.length ? `<section class="sec"><div class="sec-h"><h2>Not paid yet</h2><span class="aside">${money(owe.reduce((s,a)=>s+SV[a.s].price,0))}</span></div>
    <div class="list">${owe.map(a => `<div class="li"><span class="t">${cap(dayName(a.off)).slice(0,3)}<small>${clockS(a.start)}</small></span><span class="who"><b>${CL[a.c].name}</b><span>${svLabel(a.s)}</span></span><button class="btn warm" style="min-height:44px" data-act="charge" data-id="${a.id}">Charge ${money(SV[a.s].price)}</button></div>`).join('')}</div></section>` : ''}
  <section class="sec"><div class="sec-h"><h2>Recent payments</h2><span class="aside">from Square</span></div>
    <div class="list">${paid.map(a => `<button class="li" data-act="appt" data-id="${a.id}"><span class="t">${cap(dayName(a.off)).slice(0,3)}<small>${clockS(a.start)}</small></span><span class="who"><b>${CL[a.c].name}</b><span>${svLabel(a.s)}</span></span><span class="num" style="text-align:right"><b>${money(SV[a.s].price)}</b><br><span class="small muted">${a.tip?'+ '+money(a.tip)+' tip':'no tip'}</span></span></button>`).join('')}</div></section>`;
}
function viewSnapFresh(){
  const m = sumOf('month'), w = sumOf('week'), ahead = AP.filter(a => a.off > 0 || (a.off === 0 && a.start >= NOW)).length, owe = unpaid();
  const ks = Object.keys(CL);
  return `
  <p class="lede"><b>Your numbers start with your first ${P.unitOne}.</b> Everything you book and get paid for adds up here.</p>
  <section class="snap-hero">${MOTIF}
    <div class="snap-go"><span class="snap-k">${I.trend}${MON[T0.getMonth()]} so far</span>
      <span class="snap-big">${money(m.net)}</span><span>${m.n} ${m.n === 1 ? P.unitOne : P.unit} paid${m.tips ? ` · ${money(m.tips)} in tips` : ''}</span></div>
    <div class="pills">
      <button data-act="money" data-v="today"><b>${money(sumOf('today').net)}</b><small>today</small></button>
      <button data-act="money" data-v="week"><b>${money(w.net)}</b><small>last 7 days</small></button>
      <button data-act="tab" data-v="schedule"><b>${ahead}</b><small>booked ahead</small></button>
    </div>
  </section>
  <section class="card sec" id="s-clients"><div class="sec-h"><h2>Your ${WN}</h2><span class="aside">${ks.length}</span></div>
    ${ks.length ? `<div class="list" style="box-shadow:none">${clientRows()}</div>` : `<p class="muted">No ${WN} yet. Each one you add keeps their notes, their visits and what they’ve spent.</p>`}

    <div class="btn-row"><button class="btn primary" data-act="connect" data-v="square" ${DONE_STEPS.square ? 'disabled' : ''}>${DONE_STEPS.square ? 'Square connected' : 'Connect Square'}</button><button class="btn" data-act="fillsample">See it with sample data</button></div>
  </section>
  <section class="bento">
    ${owe.length ? `<button class="tile attn" data-act="money" data-v="today"><span class="k">${I.money}Not paid</span><span class="big">${money(owe.reduce((s,a)=>s+SV[a.s].price,0))}</span><span class="s">${owe.map(a => first(a.c)).join(', ')}</span></button>` : ''}
    <button class="tile" data-act="addcost"><span class="k">${I.wallet}Costs</span><span class="big">Add</span><span class="s">snap a receipt for rent, supplies or fuel</span></button>
    <button class="tile ${owe.length ? 'wide' : ''}" data-act="${ACC && ACC.license ? 'license' : 'addlicense'}"><span class="k">${I.badge}License</span><span class="big">${LICENSE.short}</span><span class="s">${LICENSE.tile}</span></button>
  </section>
  <p class="small muted">${P.source}</p>`;
}
function viewSnap(){
  if (P.fresh) return viewSnapFresh();
  const lastY = sum(HIST[CUR-1].slice(0, DONE)), up = (SO_FAR - lastY) / lastY * 100;
  const mo = DONE - 1, moN = HIST[CUR][mo], moP = HIST[CUR-1][mo];
  const q3 = sum(HIST[CUR].slice(DONE-3, DONE)), q3p = sum(HIST[CUR-1].slice(DONE-3, DONE));
  const dl = (c, p) => { const v = (c - p) / p * 100; return `${v >= 0 ? '▲' : '▼'} ${Math.abs(v).toFixed(0)}%`; };
  const mx = Math.max(PROJ, ...YEARS.map(yearTotal));
  const td = sumOf('today'), left = apptsOn(0).filter(a => a.start >= NOW).length, owe = unpaid();
  const kept = BOOKS[Y2].kept, keptUp = (kept - BOOKS[Y1].kept) / BOOKS[Y1].kept * 100;
  const seas = Array.from({length:12}, (_,m) => seasonAvg(m)), smx = Math.max(...seas), nowM = T0.getMonth();
  const tiles = [
    {go:'data-act="money" data-v="today"', h:`<span class="k">${I.money}Today</span><span class="big">${money(td.net)}</span><span class="s">so far · ${left} still to come</span>`},
    {go:'data-act="snapgo" data-sec="y-proj"', h:`<span class="k">${I.trend}On pace</span><span class="big">~${PROJ}</span><span class="s">${P.unit} by December</span>`},
    {go:'data-act="snapgo" data-sec="y-kept"', h:`<span class="k">${I.wallet}You kept</span><span class="big">${money(kept)}</span><span class="s">in ${Y2}, ${BOOKS_NOTE ? 'at least ' : ''}${Math.abs(keptUp).toFixed(0)}% ${keptUp >= 0 ? 'more' : 'less'} than ${Y1}</span>`},
    {go:'data-act="snapgo" data-sec="y-whatif"', h:`<span class="k">${I.bulb}What if</span><span class="big">+${money(50*RATE)}</span><span class="s">a year from one more ${W1} a week</span>`},
    {go:'data-act="clients"', h:`<span class="k">${I.clients}Reach out</span><span class="big">${reachList().length}</span><span class="s">people likely to book if you say hi</span>`},
    {go:'data-act="license"', h:`<span class="k">${I.badge}License</span><span class="big">${LICENSE.short}</span><span class="s">${LICENSE.tile}</span>`},
  ];
  if (MULTI) tiles.push({go:'data-act="snapgo" data-sec="y-proj"', h:`<span class="k">${I.clients}Team · ${CUR}</span><span class="team">${P.team.map((t,i) => `<span class="cost" style="grid-template-columns:52px 1fr 44px"><span>${t}</span><span class="tr"><i style="width:${P.teamSplit[i]*100}%"></i></span><b>${Math.round(P.teamSplit[i]*100)}%</b></span>`).join('')}</span><span class="s">share of this year’s ${P.unit}</span>`});
  if (owe.length) tiles.unshift({cls:'attn', go:'data-act="money" data-v="today"', h:`<span class="k">${I.money}Not paid</span><span class="big">${money(owe.reduce((s,a)=>s+SV[a.s].price,0))}</span><span class="s">${owe.map(a => first(a.c)).join(', ')}</span>`});
  if (tiles.length % 2) tiles[tiles.length-1].wide = true;
  tiles.push({wide:true, go:'data-act="snapgo" data-sec="y-season"', h:`<span class="k">${I.leaf}Your seasons</span><span class="s">${nextSlow != null ? `<b>${MON[nextSlow]} is usually slow.</b> ` : ''}Gold months are your slowest.</span>
      <span class="mb" aria-hidden="true">${seas.map((v,m) => `<i class="${SLOW.includes(m)?'slow':''} ${m===nowM?'now':''}" style="height:${Math.round(v/smx*100)}%"></i>`).join('')}</span>
      <span class="ml" aria-hidden="true">${MON.map((n,m) => `<span class="${m===nowM?'now':''}">${n[0]}</span>`).join('')}</span>`});
  tiles.push({wide:true, go:'data-act="snapgo" data-sec="y-costs"', h:`<span class="k">${I.wallet}Where it goes · ${P.costsYear}</span><span class="s">${COSTS[0].n} is <b>${Math.round(COSTS[0].v/COST_TOTAL*100)}%</b> of your costs.</span>${costRows()}`});
  return `
  <p class="lede"><b>${SO_FAR} ${P.unit}</b> this year. On pace for about ${PROJ}${RECORD ? ', your best year yet' : ''}.</p>
  <section class="snap-hero">${MOTIF}
    <button class="snap-go" data-act="snapgo" data-sec="y-proj">
      <span class="snap-k">${I.trend}Your year · through ${MON[DONE-1]}</span>
      <span class="snap-big">${SO_FAR}<small>${P.unit}</small></span>
      <span><span class="delta">${dl(SO_FAR, lastY)}</span> vs the same months of ${CUR-1}</span>
      <span class="yrs">${[...YEARS].reverse().map(y => { const n = yearTotal(y); return `<span class="yr ${y===CUR?'cur':''}"><span>${y}</span><span class="tr"><i style="width:${n/mx*100}%"></i>${y===CUR?`<u style="left:${n/mx*100}%;width:${(PROJ-n)/mx*100}%"></u>`:''}</span><b>${y===CUR?'~'+PROJ:n}</b></span>`; }).join('')}</span>
      <span class="cta">Open your year ${I.right}</span>

function yearChart(){

  const max = Math.ceil(Math.max(PROJ_HI, BEST_PAST) / 100) * 100;

  const bar = (x, v0, v1, cls) => { const r = v0 === 0 ? Math.min(4, (y(v0) - y(v1))) : 0, yt = y(v1), yb = y(v0);
    return `<path class="${cls}" d="M${x},${yb} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+bw-r} Q${x+bw},${yt} ${x+bw},${yt+r} V${yb} Z"/>`; };
  const bars = YEARS.map((yr,i) => {
    const x = step*i + (step-bw)/2, on = yr === S.yr, n = yearTotal(yr);
    let g = bar(x, 0, n, 'bar' + (on ? ' on' : ''));
    if (yr === CUR) g += `<path class="proj" d="M${x},${y(n)} V${y(PROJ)} H${x+bw} V${y(n)}"/>`;
    const top_ = yr === CUR ? PROJ : n;
    return `${g}<text class="${on?'val':''}" x="${x+bw/2}" y="${y(top_)-8}" text-anchor="middle">${yr===CUR?'~'+PROJ:n}</text>
      <text class="${on?'on':''}" x="${x+bw/2}" y="${base+20}" text-anchor="middle">${yr}</text>
      <rect class="hit" x="${step*i}" y="0" width="${step}" height="${H}" data-act="yr" data-v="${yr}"><title>${yr}: ${n} ${P.unit}</title></rect>`;
  }).join('');
  const n = yearTotal(S.yr), months = HIST[S.yr], bi = months.indexOf(Math.max(...months));
  const detail = S.yr === CUR
    ? `<b>${CUR} so far</b> · ${n} ${P.unit} through ${MON[DONE-1]} · expected ${PROJ_LO} to ${PROJ_HI} by December`
    : `<b>${S.yr}</b> · ${n} ${P.unit} · about ${money(n*RATE)} · busiest month ${MON[bi]} (${months[bi]})`;
  return `<div class="sec-h"><h2>${unitCap} each year</h2><span class="aside">tap a year</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unitCap} each year, ${YEARS[0]} to ${CUR}">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch-bg" width="6" height="6"/><line class="hatch-ln" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
    <line class="grid" x1="0" x2="${W}" y1="${y(max)}" y2="${y(max)}"/><text x="0" y="${y(max)-6}">${max}</text>
    <line class="base" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${bars}
  </svg>
  <div class="key"><span><i></i>Done</span><span><i class="p"></i>Expected for the rest of ${CUR}</span></div>
  <p class="detail num">${detail}</p>`;
}
function chart(){

  const W = 340, H = 180, top = 28, base = 146, bw = 30, step = W / 7;
  const max = Math.max(100, Math.ceil(Math.max(...data.map(d => d.net)) / 200) * 200);
  const y = v => base - (v / max) * (base - top);
  const bars = data.map((d,i) => {
    const x = step * i + (step - bw) / 2, on = offs[i] === S.bar, h = base - y(d.net), r = Math.min(4, h);
    const shape = d.net ? `<path class="bar${on?' on':''}" d="M${x},${base} V${y(d.net)+r} Q${x},${y(d.net)} ${x+r},${y(d.net)} H${x+bw-r} Q${x+bw},${y(d.net)} ${x+bw},${y(d.net)+r} V${base} Z"/>` : '';
    const lab = d.net ? (on ? `<text class="val" x="${x+bw/2}" y="${y(d.net)-8}" text-anchor="middle">${money(d.net)}</text>` : '') : `<text x="${x+bw/2}" y="${base-8}" text-anchor="middle">off</text>`;
    const dl = dateOf(offs[i]);
    return `${shape}${lab}<text class="${on?'on':''}" x="${x+bw/2}" y="${base+20}" text-anchor="middle">${offs[i]===0?'Today':DOW[dl.getDay()].slice(0,3)}</text>
      <rect class="hit" x="${step*i}" y="0" width="${step}" height="${H}" data-act="bar" data-v="${offs[i]}"><title>${dayLong(offs[i])}: ${money(d.net)}</title></rect>`;
  }).join('');
  const sel = take(S.bar);
  return `<div class="sec-h"><h2>Last 7 days</h2><span class="aside">tap a day</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money made each of the last 7 days">
    <line class="grid" x1="0" x2="${W}" y1="${top}" y2="${top}"/><text x="0" y="${top-6}">${money(max)}</text>
    <line class="base" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${bars}
  </svg>
  <p class="detail num"><b>${S.bar===0?'Today so far':dayLong(S.bar)}</b> · ${sel.n ? `${money(sel.net)} + ${money(sel.tips)} tips · ${sel.n} session${sel.n>1?'s':''}` : 'Day off'}</p>`;
}

function ask(q){
  const s = q.toLowerCase();
  let a;
  const hit = Object.keys(CL).find(k => s.includes(first(k).toLowerCase()) || s.includes(CL[k].name.toLowerCase()));
  const dayHit = () => {
    if (/tomorrow/.test(s)) return 1;
    if (/today/.test(s)) return 0;
    const i = DOW.findIndex(d => s.includes(d.toLowerCase()));
    return i >= 0 ? nextOffWith(1, i) : 1;
  };
  if (hit) {
    const n = nextAppt(hit), c = CL[hit];
    const sp = spend(hit);
    a = `<b>${c.name}</b> was last in ${lastText(hit).toLowerCase()}. ${sp.a.v ? `Spent <b>${money(sp.y.$)}</b> this year and ${money(sp.a.$)} all time. ` : ''}${n ? `Next visit: <b>${whenText(n)}</b>, ${svLabel(n.s)}.` : 'Nothing booked yet.'}
      <div class="btn-row" style="margin-top:10px"><button class="btn" data-act="client" data-c="${hit}">Open notes</button><button class="btn primary" data-act="book" data-c="${hit}">Book</button></div>`;
  } else if (/(year|pace|forecast|project|on track|going)/.test(s)) {
    a = P.fresh ? `Your first year on Sole started this month. So far you’ve brought in <b>${money(sumOf('month').net)}</b> from ${sumOf('month').n} ${P.unit}. Connect Square or upload past sales and Sole fills in the rest of your year.` : `You’ve done <b>${SO_FAR} ${P.unit}</b> this year through ${MON[DONE-1]}, worth about <b>${money(SO_FAR*RATE)}</b>. You’re on pace for about <b>${PROJ}</b>, which would beat your best year (${BEST_PAST_Y}, with ${BEST_PAST}).
      <div class="btn-row" style="margin-top:10px"><button class="btn primary" data-act="money" data-v="year">See your year</button></div>`;
  } else if (/(paid|owe|unpaid|charge)/.test(s)) {
    const u = unpaid();
    a = u.length ? `<ul>${u.map(x => `<li><b>${CL[x.c].name}</b>: ${money(SV[x.s].price)} for ${dayName(x.off)}</li>`).join('')}</ul>` : 'Everyone has paid. Nice.';
  } else if (/(open|free|room|available|opening|gap)/.test(s)) {
    const off = dayHit(), g = freeGaps(off);
    a = isOff(off) ? `${cap(dayName(off))} is your day off.` : g.length ? `${cap(dayName(off))} you’re open:<ul>${g.map(([x,y]) => `<li><b>${clock(x)} to ${clock(y)}</b> (${dur(y-x)})</li>`).join('')}</ul>` : `${cap(dayName(off))} is fully booked.`;
  } else if (/(made|make|earn|money|income|tips|took|sales)/.test(s)) {
    const r = /today/.test(s) ? 'today' : /week|7/.test(s) ? 'week' : 'month', t = sumOf(r);
    a = `You made <b>${money(t.net)}</b> ${RANGES[r].name}, plus <b>${money(t.tips)}</b> in tips, from ${t.n} sessions.`;
  } else if (/(who|next|schedule|coming)/.test(s)) {

function obLogo(file){

    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

function sigPad(){
  const cv = $('#sig'); if (!cv) return;
  const b = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;

  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, b.width, b.height);
  g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1A1A1A';

  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { down = true; last = pt(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} };
  cv.onpointermove = e => { if (!down) return; const p = pt(e); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; cv.dataset.drawn = '1'; };

}

function applyResponse(r, quiet){

      <button class="btn primary" data-act="ac-save">Save ${W1}</button>`); setTimeout(() => { const n = $('#ac-name'); n && n.focus(); }, 50); break;
    case 'ac-save': { const nm = ($('#ac-name').value || '').trim(); if (!nm) { toast('Add a name first.'); break; }
      const k = 'm' + Date.now().toString(36); CL[k] = {name:nm.includes(' ') ? nm : nm + ' ', phone:($('#ac-phone').value || '').trim() || 'Not added yet', since:T0.getFullYear(), visits:0, last:null,
        isNew:true, intake:false, rows:[], note:($('#ac-note').value || '').trim(), mine:true};
      closeSheet(); render(); openClient(k); toast(`${nm} added.`); break; }
    case 'connect': { const sq = v === 'square';
      sheet(`${top(sq ? 'Get paid with Square' : 'Bring in your calendar', sq ? 'Sign in once. Sole does the rest.' : 'Where do you book people now?')}
      ${sq ? `<div class="card facts2"><p>Payments, tips and customers from Square show up in Today and Snapshot by themselves, and “Charge” opens Square with the amount ready.</p></div>`
        : `<div class="chips">${['MassageBook','Vagaro','Booksy','Square Appointments','Google Calendar','Apple Calendar'].map(x => `<button class="chip" data-act="connect-go" data-v="cal">${x}</button>`).join('')}</div>`}
      ${sq ? '<button class="btn primary" data-act="connect-go" data-v="square">Connect Square</button>' : `<button class="btn line" data-act="connect-go" data-v="cal">I’ll book everything in Sole</button>`}
      <p class="small muted">This preview marks it as connected. In the real app you sign in to ${sq ? 'Square' : 'that app'} and your ${sq ? 'payments' : 'bookings'} come in.</p>`); break; }
    case 'connect-go': DONE_STEPS[v] = true; closeSheet(); render(); toast(v === 'square' ? 'Square connected.' : 'Calendar set.'); break;
    case 'checkforms': DONE_STEPS.forms = true; S.tab = 'forms'; render(); window.scrollTo(0,0); break;
    case 'addlicense': sheet(`${top('Add your license', 'Sole reminds you three months before it renews.')}
      <div class="field"><span class="label">License</span><input class="text-in" id="lic-name" autocomplete="off" placeholder="State license, insurance or certification"></div>
      <div class="field"><span class="label">Renews</span><input class="text-in" id="lic-when" type="month"></div>
      <button class="btn primary" data-act="lic-save">Save</button>`); break;
    case 'lic-save': { const w = $('#lic-when').value; if (!w) { toast('Pick the month it renews.'); break; }
      const [y, m] = w.split('-').map(Number); ACC.license = {name:($('#lic-name').value || '').trim(), next:`${MON[m-1]} ${y}`, short:`${MON[m-1].slice(0,3)} ${y}`};
      saveState(); closeSheet(); boot(KEY); break; }
    case 'addcost': sheet(`${top('Add a cost', 'Rent, supplies, fuel, insurance, anything you pay for.')}
      <div class="card facts2"><p>In the real app you snap a photo of the receipt. Sole reads the amount and the store, files it, and it shows up in “Where it goes” and in what you kept.</p></div>`); break;
    case 'fillsample': if (ACC) { ACC.sample = true; saveState(); closeSheet(); window.scrollTo(0,0); boot(KEY); setTimeout(() => toast('Sample customers and numbers added. Clear them from the business menu.'), 50); } break;
    case 'clearsample': if (ACC) { delete ACC.sample; saveState(); closeSheet(); window.scrollTo(0,0); boot(KEY); setTimeout(() => toast('Sample data cleared.'), 50); } break;
    case 'welcome-setup': try { localStorage.setItem('sole-seen', '1'); } catch (_) {} OB = {step:1, trade:null, what:'', who:0, unit:0, biz:'', owner:'', mate:'', two:false, logo:null, colors:[], color:null, docs:[], prices:{}, names:{}}; obRender(); break;
    case 'welcome-look': try { localStorage.setItem('sole-seen', '1'); } catch (_) {} closeSheet(); setTimeout(() => toast('Tap the business name at the top to see other kinds of business, or to set up yours.'), 50); break;
    case 'book': openBook(el.dataset.c ? {c:el.dataset.c} : {}); break;
    case 'blockt': openBook({kind:'block', off:S.day}); break;
    case 'range': S.range = v; render(); break;
    case 'bar': S.bar = +v; render(); break;
    case 'yr': S.yr = +v; render(); break;
    case 'wi': { const k = el.dataset.k; S[k] = k === 'wiC' ? Math.max(0, Math.min(10, S[k] + +v)) : Math.max(-30, Math.min(50, S[k] + +v)); render(); break; }
    case 'b-c': B.c = v; rerenderBook(); if (v === 'new') $('#new-name').focus(); break;
    case 'b-s': B.s = v; fixStart(); rerenderBook(); break;
    case 'b-l': B.label = v; if (v === 'Day off') { B.len = CLOSE - OPEN; B.start = null; fixStart(); } rerenderBook(); break;
    case 'b-len': B.len = +v; fixStart(); rerenderBook(); break;
    case 'b-d': B.off = +v; fixStart(); rerenderBook(); break;
    case 'b-t': B.start = +v; rerenderBook(); break;
    case 'b-go': bookGo(); break;
  }
});
on('change', e => {
  if (e.target.dataset && e.target.dataset.yn) { const m = $('#ff-' + e.target.dataset.yn + '-more'); if (m) { m.hidden = e.target.value !== 'yes'; if (!m.hidden) m.focus(); } }
  if (e.target.id === 'ob-logo' && OB) obLogo(e.target.files[0]);
  if (e.target.id === 'ob-docs' && OB) obDocs(e.target.files);
});
on('input', e => {
  if (OB && e.target.id === 'ob-biz') OB.biz = e.target.value;
  if (OB && e.target.id === 'ob-owner') OB.owner = e.target.value;
  if (OB && e.target.id === 'ob-mate') OB.mate = e.target.value;
  if (OB && e.target.id.startsWith('ob-price-')) OB.prices[e.target.id.slice(9)] = e.target.value.replace(/[^0-9.]/g, '');
  if (OB && e.target.id.startsWith('ob-name-')) OB.names[e.target.id.slice(8)] = e.target.value;
  if (OB && e.target.id === 'ob-what') OB.what = e.target.value;
  if (e.target.id === 'cl-search') { S.search = e.target.value; $('#cl-list').innerHTML = clientRows(); }
  if (e.target.id === 'snap-search') { S.search = e.target.value; $('#snap-res').innerHTML = S.search.trim() ? `<div class="list">${clientRows()}</div>` : ''; }
  if (e.target.id === 'new-name' && B) { B.newName = e.target.value; const g = $('#book-go'); g.disabled = !bookReady(); g.textContent = bookLabel(); }
});
on('submit', e => {
  if (e.target.id === 'fill-form') { e.preventDefault(); if (FILL) submitFill(); return; }
  if (e.target.id === 'ask-form') { e.preventDefault(); const q = $('#ask-in').value.trim(); if (q) ask(q); }
});
on('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML) closeSheet(); });

RESP.forEach(r => applyResponse(r, true));
render();
if (P.real && !SQ) loadSquare(KEY);
if (EDITION === 'demo' && !OB) { let seen = false; try { seen = !!localStorage.getItem('sole-seen'); } catch (_) {}
  if (!seen) sheet(`<div class="welcome"><div class="brand">${SUNMARK}<b>Sole</b></div>
    <p>The app for the one-person business. Your schedule, your customers, your money and your paperwork, in one place made for yours.</p></div>
    <button class="btn primary" data-act="welcome-setup">Set up my business</button>
    <button class="btn line" data-act="welcome-look">Look around a sample business</button>`); }
}
let START = 'massage';
try { START = localStorage.getItem('sole-current') || START; } catch (_) {}
boot(PROFILES[START] || ACCOUNTS[START] ? START : 'massage');
</script>
