# Signs the SolePro iPhone and Android apps and sends them to the stores' testing tracks (TestFlight and Google Play
# internal testing), and uploads the store listings (app/store/). Run by hand: Actions > Release to the stores > Run
# workflow. Nothing here submits an app for review or publishes it; Brooks does that in App Store Connect and Play
# Console. Setup: app/store/README.md, "Release". Same design as Pasalo's release workflow.
#
# Secrets (Settings > Secrets and variables > Actions). The App Store Connect key and the Play service account can be
# the same ones Pasalo uses (one per developer account):
#   App Store: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (the .p8 file's text; an App Store Connect API key with the Admin
#     role, so Xcode can make the distribution certificate and profile itself). The Team ID is in app/native.json.
#   Google Play: ANDROID_UPLOAD_KEYSTORE (the upload keystore, base64), ANDROID_UPLOAD_KEYSTORE_PASSWORD,
#     PLAY_SERVICE_ACCOUNT (a service account's JSON key with release access to SolePro in Play Console).
name: Release to the stores
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which app"
        type: choice
        options: [both, ios, android, none]  # none: no build, only the store listings (with "listings")
        default: both
      version:
        description: "Version people see (e.g. 1.0)"
        type: string
        default: "1.0"
      play_status:
        description: "Google Play release status (draft until the app has been published once)"
        type: choice
        options: [draft, completed]
        default: draft
      mac:
        description: "Mac to build the iPhone app on (try another if GitHub can't find one)"
        type: choice
        options: [macos-latest, macos-26, macos-15, macos-15-intel]
        default: macos-latest
      listings:
        description: "Also upload the store listings (text and screenshots)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: release
env:
  # Each run's number is the build number both stores need to go up with every upload.
  BUILD_NUMBER: ${{ github.run_number }}
  VERSION: ${{ inputs.version }}
jobs:
  ios:
    if: inputs.platform != 'android' && inputs.platform != 'none'
    runs-on: ${{ inputs.mac }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the setup
        run: |
          TEAM=$(node -p "require('./native.json').appleTeamId")
          [ -n "$TEAM" ] || { echo "::error::Put the Apple Team ID in app/native.json (appleTeamId)"; exit 1; }
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] || { echo "::error::Add the secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY"; exit 1; }
          echo "TEAM=$TEAM" >> "$GITHUB_ENV"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Build the app and copy it into the iPhone project
        run: npm run build:native
      - name: App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"
      # Archived with a local ad-hoc signature (it keeps the app's entitlements) instead of a development certificate:
      # GitHub's Macs are fresh each run, so a development certificate made on one can't be used on the next. The
      # export below signs for the App Store with Apple's cloud-managed distribution certificate (the Admin API key
      # lets Xcode use it). Same fix as Pasalo's, whose first TestFlight upload went through with it (Nov 4, 2026).
      - name: Archive
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SolePro.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE= \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tail -60
      - name: Send to App Store Connect (TestFlight)
        working-directory: app/ios/App
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SolePro.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -40
          echo "Uploaded SolePro $VERSION ($BUILD_NUMBER). It shows in App Store Connect > TestFlight after Apple processes it (about 10 to 30 minutes)."

  android:
    if: inputs.platform != 'ios' && inputs.platform != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the setup
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] || { echo "::error::Add the secrets ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_KEYSTORE_PASSWORD"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the app and copy it into the Android project
        run: npm run build:native
      - name: Signed release bundle
        working-directory: app/android
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          RELEASE_KEYSTORE="$RUNNER_TEMP/upload.jks" RELEASE_VERSION_CODE="$BUILD_NUMBER" RELEASE_VERSION_NAME="$VERSION" \
            ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      # Kept for the first upload, which Google requires by hand in Play Console (Test and release > Internal testing).
      - uses: actions/upload-artifact@v4
        with:
          name: solepro-android-release-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Send to Google Play (internal testing)
        if: env.PLAY_SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.brookstelles.solepro
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status }}

  listings:
    if: inputs.listings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install fastlane --no-document
      - name: Check and lay out the listings
        run: node scripts/check_store.mjs && node scripts/stage_store.mjs
      - name: App Store listing (text and screenshots; nothing is submitted)
        if: inputs.platform != 'android' && env.ASC_KEY_ID != ''
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/asc.json",JSON.stringify({key_id:process.env.ASC_KEY_ID,issuer_id:process.env.ASC_ISSUER_ID,key:process.env.ASC_KEY,in_house:false}))'
          # An empty Deliverfile: without one, deliver stops to ask whether to set one up (no one can answer in CI).
          touch Deliverfile
          fastlane deliver --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier com.brookstelles.solepro \
            --metadata_path build/store/ios/metadata --screenshots_path build/store/ios/screenshots \
            --skip_binary_upload true --overwrite_screenshots true --submit_for_review false \
            --run_precheck_before_submit false --force true
      - name: Google Play listing (text and images)
        if: inputs.platform != 'ios' && env.PLAY_SERVICE_ACCOUNT != ''
        run: |
          fastlane supply --json_key_data "$PLAY_SERVICE_ACCOUNT" --package_name com.brookstelles.solepro \
            --metadata_path build/store/android --skip_upload_apk true --skip_upload_aab true \
            --skip_upload_changelogs true
